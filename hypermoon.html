<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Moon Dark Side — hidden content on the shadowed hemisphere</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
</style>
<script src="js/threejs.org_build_three.js"></script>
<script src="js/stream-broadcast.js"></script>
</head>
<body>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const num = (key, fallback) => {
    const v = Number.parseFloat(params.get(key));
    return Number.isFinite(v) ? v : fallback;
  };

  // Starter kit: the moon discs, vajra proxies and eye backdrop are small
  // enough to live in git, but the scraped gif library and the downloaded clips
  // are not, so a fresh clone would run with an empty orbit and a black iris.
  // npm run starter bakes low-bandwidth copies of both into assets/starter, and
  // the two loaders below reach for them only when the real media is absent.
  const STARTER = "assets/starter";
  // Matched on the file name alone: the kit is flat, and a clip named in the
  // launch URL as assets/xfeeefeee/circle/x.mp4 is assets/starter/clips/x.mp4.
  function starterCopy(src) {
    const name = String(src).split("?")[0].split("/").pop();
    return name ? STARTER + "/clips/" + name : "";
  }

  const MOON_SRC = params.get("video") || "loops/3d moon/web/moon-rotating-6s-alpha.webm";
  // Optional content revealed in the dark side: a video, an image, a
  // comma-separated slideshow of images (imagesec = seconds per image), or a
  // keyword rendered in-page: crt (live terminal), vajra (cave of spinning
  // dorjes), incant (mantra phrases).
  let CONTENT_SRC = params.get("content") || "";
  const CONTENT_KEY = CONTENT_SRC.trim().toLowerCase();
  // A keyword can carry an argument after a colon — gifswarm:hearts picks one
  // theme out of the scraped library — so classification looks at the stem.
  const baseKey = (k) => String(k == null ? "" : k).split(":")[0];
  const keyArg = (k) => String(k == null ? "" : k).split(":").slice(1).join(":");
  const KEYWORD_CONTENT = [
    "crt", "vajra", "incant", "screen", "mumins", "fisher", "harmonics", "cymatics",
    "gifswarm", "orbit",
    "fold", "foldsonic", "foldhelix", "foldjitter", "foldgeo", "foldivm"
  ].includes(baseKey(CONTENT_KEY));
  // content=orbit[:theme] is the gif swarm's orbit layer on its own: gifs take
  // the vajras' tilted lanes round the disc and nothing whatever is drawn on
  // the surface — no window cut into it, no letter panel, no word. For a moon
  // that should stay a moon and still have something circling it.
  const ORBIT_ONLY = baseKey(CONTENT_KEY) === "orbit";
  const MOSAIC_OFF = params.get("mosaic") === "0";
  const IMAGE_SEC = num("imagesec", 8);
  const IMG_SCALE = num("imgscale", 0.55); // image size as fraction of frame, centered on the disc
  const IMAGE_EXT = /\.(png|jpe?g|webp|gif|avif)$/i;
  const contentList = KEYWORD_CONTENT ? [] : CONTENT_SRC.split(",").map((s) => s.trim()).filter(Boolean);
  const isImageContent = contentList.length > 0 && contentList.every((s) => IMAGE_EXT.test(s));
  const isVideoContent = contentList.length === 1 && !isImageContent;
  // Default content: the hyperstition word rendered as letter mosaics built
  // from the astronaut/moon image cubes (same style as hyperstition-moon-halo).
  // Passing ?text=... falls back to plain monospace text instead.
  const TEXT_PARAM = params.get("text");
  const TEXT = (TEXT_PARAM || "HYPERSTITION|THE DARK SIDE SPEAKS|WAIT FOR THE TURN").split("|");
  let MOSAIC_WORD = String(params.get("word") || "hyperstition").toLowerCase();
  // Guest marks (?logo=a.png,b.svg): someone else's logo takes the word's
  // place on the shadowed panel, so it rides the same tracked dark patch and
  // curves off the limb with it. The token "word" is the mosaic itself, so a
  // list can alternate a host word with its guests. logomode=plain draws the
  // artwork as supplied, dimmed by logoink, which is what a guest normally
  // wants; cubes rebuilds the mark out of the same image cubes the letters
  // are made of, which suits a bold monogram and destroys a wordmark.
  // logosec is how long a mark holds the panel.
  let LOGO_SRC = params.get("logo") || "";
  let LOGO_MODE = String(params.get("logomode") || "plain").toLowerCase();
  let LOGO_INK = Math.max(0, Math.min(1, num("logoink", 0.42)));
  let LOGO_SEC = Math.max(0, num("logosec", 24));
  // A guest gets a wider panel than the word does. The word is sized to the
  // measured dark patch and reads at that size because its glyphs are five
  // cells wide; a wordmark carries much finer detail and vanishes there.
  let LOGO_SCALE = Math.max(0.3, num("logoscale", 1.7));
  // Flashed mark (?flash=hermes/logo.png): the mark is thrown over the disc for
  // a beat and gone again, once every flashsec. This is deliberately not the
  // guest-mark panel above: a mark anchored to the shadow patch spends most of
  // a minute round the back of the moon, and something that shows for three
  // seconds in sixty has to be there when they come. Blended additively,
  // so a mark drawn on black needs no alpha and no keying — the black adds
  // nothing — and it lands as light on the surface rather than a sticker on it.
  const FLASH_SRC = params.get("flash") || "";
  let FLASH_SEC = Math.max(0.5, num("flashsec", 60));     // seconds between flashes
  let FLASH_HOLD = Math.max(0.05, num("flashhold", 3));   // seconds at full strength
  let FLASH_SCALE = Math.max(0.1, num("flashscale", 1));  // 1 = the mark spans the disc
  let FLASH_GAIN = Math.max(0, num("flashgain", 1));      // how hot the flash burns
  const FLASH_FADE = Math.max(0, num("flashfade", 0.14)); // seconds of rise and fall
  // Kiosk mode (?kiosk=1): hide the cursor and go fullscreen on the first
  // click/keypress (browsers require a gesture). npm run kiosk:hypermoon
  // launches Chrome in true kiosk mode with autoplay enabled.
  const KIOSK = params.get("kiosk") === "1";
  // Unattended-show survival. Two separate problems, two knobs:
  // ?awake=0 drops the screen wake lock, which is what stops macOS idling
  // into display sleep (and, with lock-on-sleep, into the login window).
  // ?ticker= picks how frames are driven: auto keeps requestAnimationFrame
  // but falls back to a timer whenever the compositor stops calling us
  // (occluded window, blanked or locked display), so the canvas — and the
  // LAN broadcast captured off it — keeps producing frames. raf/timer pin
  // one source, mostly for testing.
  const KEEP_AWAKE = params.get("awake") !== "0";
  const TICKER = ["auto", "raf", "timer"].includes(params.get("ticker")) ? params.get("ticker") : "auto";
  const KEEP_FPS = Math.max(1, Math.min(60, num("keepfps", 30)));
  // Solo mode (?solo=1 with a keyword content): render the window content
  // full-frame instead of compositing it onto the moon. Used to bake
  // standalone loop videos of the fold repertoire for the bleed-through
  // library (scripts/export-fold-loops.mjs).
  const SOLO = params.get("solo") === "1" && KEYWORD_CONTENT;
  // Wireframe ink for the fold/geodesic/ivm makers: primary + accent hex.
  // e.g. ?ink=ff3b30&ink2=ff8a5c turns the whole repertoire red.
  const INK_HEX = "#" + String(params.get("ink") || "59d6ff").replace("#", "");
  const INK2_HEX = "#" + String(params.get("ink2") || "ffb46b").replace("#", "");
  // Offscreen render size of the content makers (512 is plenty on the moon;
  // solo bakes want 1024+).
  const TEX_SIZE = Math.max(256, Math.round(num("texsize", 512)));
  // What the in-page generators clear to. They are composited into the moon as
  // light, so whatever sits behind their figures is added to the surface across
  // the whole of the window - and a flat near-black navy, faint as it is on its
  // own, comes out as a lit rectangle on the grey terrain. Black adds nothing,
  // which is what a background that is not there should do.
  const GEN_BG = 0x000000;
  // Live stream (?stream=1): capture this canvas and broadcast it over the
  // LAN via the signaling server (npm run stream:server). Other devices
  // watch at http://<this-machine's-ip>:8080/stream-view.html.
  const STREAM = params.get("stream") === "1";
  const STREAM_FPS = num("streamfps", 30);
  // Window mode: content lives in a recessed "window" carved behind the
  // letter panel, pinned to the same dark-terrain anchor and rotating with
  // the moon. It opens wide in shadow and seals to a glimmer in sunlight.
  // ?mosaic=0 with file content skips the letters and window entirely and
  // bleeds the content straight through the shadowed hemisphere (planar).
  let WIN = !!CONTENT_SRC && !TEXT_PARAM && !ORBIT_ONLY && (KEYWORD_CONTENT || !MOSAIC_OFF);
  // incant and the bucky folds render without the letter panel: the
  // geometry/mantra is the show, no word text over it.
  const wordlessKey = (k0) => ((k) => k === "incant" || k === "mumins" || k === "fisher"
    || k === "gifswarm"
    || k === "harmonics" || k === "cymatics" || /^fold/.test(k))(baseKey(k0));
  // Figures painted on the surface rather than glowing through it. The gif
  // swarm belongs here too: they are keyed cut-outs with their own alpha, and
  // added as light over grey terrain they are a ghost of themselves.
  const drawnKey = (k0) => ((k) => k === "mumins" || k === "fisher"
    || k === "gifswarm")(baseKey(k0));
  // Content that is a screen and should read as one: a rectangular opening
  // recessed into the shell, with the panel lit inside it. Everything the page
  // generates itself is a pattern or a figure with no edges of its own, and
  // giving it an opening turns it into a picture hung on the moon rather than
  // something the moon is doing.
  const screenKey = (k) => k === "crt" || k === "screen";
  const gateFor = (k) => (baseKey(k) === "gifswarm" ? 0.7 : 0.05);
  let WORDLESS_WIN = WIN && (wordlessKey(CONTENT_KEY) || MOSAIC_OFF);
  // Orbit-only stays on the mosaic path even though no word is drawn: that is
  // what tunes the terminator and the earthshine for a bare moon and anchors
  // the surface to the sphere. uWordOn holds the letters at zero instead.
  const useMosaic = !TEXT_PARAM && (!CONTENT_SRC || WIN || ORBIT_ONLY);
  // Window/reveal behavior (all live-adjustable from the controller):
  let BLEED = num("bleed", 0);           // planar: target % of the disc auto-revealed (0 = fixed threshold)
  let APPARITION = num("apparition", CONTENT_KEY === "incant" ? 8 : 0); // avg s between random reveals (0 = steady)
  let PEEK = num("peek", WIN && !WORDLESS_WIN ? 16 : 0); // s between letter-dissolve peeks (0 = never)
  const PEEK_GROW = num("peekgrow", 1.3);  // window growth while the letters are away
  const PEEK_HOLD = num("peekhold", 4.5);  // s the window stays fully open per peek
  const WIN_DEPTH = num("windepth", 0.55); // how much the surface recesses inside the window
  let WHEN = params.get("when") || "WEDNESDAY 22:00"; // announced time on the live CRT screen
  // Mosaic tiles are dim photographs, so the default mask/brightness is more
  // generous than for plain glowing text.
  const THRESHOLD = num("threshold", useMosaic ? 0.22 : 0.09); // luma below this = dark side
  const FEATHER = num("feather", useMosaic ? 0.08 : 0.10);     // soft edge at the terminator
  const BRIGHT = num("bright", useMosaic ? 2.2 : 0.85);        // hidden-content brightness
  const SCROLL_SEC = num("scrollsec", useMosaic ? 0 : 60);     // seconds per full text scroll (0 = static)
  const FLICKER = num("flicker", useMosaic ? 0.15 : 0.35);     // 0..1 text shimmer amount
  const TRACK_THRESH = num("trackthresh", 0.10);               // luma cutoff when locating the shadow region
  // Faint earthshine on the shadowed hemisphere so the dark side reads as
  // part of the sphere (otherwise it is pitch black against space and any
  // revealed content looks like it floats off the limb).
  const LIFT = num("lift", useMosaic ? 0.06 : 0.0);
  const FONT_PX = num("fontsize", 72);
  const COLOR = new THREE.Color(params.get("color") ? "#" + params.get("color").replace("#", "") : "#8fd8ff");
  // Moon disc estimate in video UV space (content is clipped to the disc so
  // it reads as being ON the shadowed surface, not floating in space).
  const DISC_CX = num("cx", 0.5);
  const DISC_CY = num("cy", 0.5);
  const DISC_R = num("cr", 0.38); // radius in units of frame height
  let SPEED = num("speed", 1 / 3); // moon rotation playback rate (live-adjustable)
  // Spherical anchoring (mosaic): the word is pinned to fixed lon/lat
  // coordinates on the rotating globe, like a continent.
  const ROT_PER = num("rotper", 0);  // seconds of video per full revolution (0 = one loop)
  const ROT_DIR = num("rotdir", 1);  // spin direction of the source video (1 or -1)
  const ANG_W = num("angw", 1.6);    // word width on the surface, radians of longitude
  const ANG_H = num("angh", 1.0);    // word height, radians of latitude
  // Manual nudge of the auto-found anchor, in degrees (west = negative lon).
  // Kept mutable so the controller can nudge lon/lat live over the channel.
  let LON_OFF = num("lonoff", -15) * (Math.PI / 180);
  let LAT_OFF = num("latoff", 0) * (Math.PI / 180);
  // Audio reactivity: 0 = deaf, 1 = default, 2 = exaggerated. Levels arrive
  // over the controller channel (from its audio deck) or from the local mic
  // (?mic=1 or the controller's "mic on moon" toggle).
  let REACT = num("react", 1);
  let MIC = params.get("mic") === "1";
  // Whole-moon opacity (?alpha=0..1, live-adjustable): fades the entire moon
  // render out, revealing whatever backdrop sits behind the canvas.
  let ALPHA = Math.max(0, Math.min(1, num("alpha", 1)));
  // Backdrop layer (?backdrop=a.gif,b.gif): animated gifs (or any images)
  // shown in the DOM *behind* the transparent WebGL canvas, pinned exactly
  // to the moon disc. backscale sizes them relative to the disc diameter,
  // backalpha fades the layer, backsec crossfades through the list.
  let BACKDROP_SRC = params.get("backdrop") || "";
  let BACK_SCALE = num("backscale", 1);
  // backfit=0 seats a backdrop by its file canvas instead of by its artwork
  // (see measureFit) - the old behaviour, for a source that is deliberately
  // framed off centre.
  let BACK_FIT = num("backfit", 1) !== 0;
  let BACK_ALPHA = Math.max(0, Math.min(1, num("backalpha", 1)));
  let BACK_SEC = num("backsec", 12);
  // Sky (?stars=N): a parallax starfield painted under everything else, so
  // the moon and the orbiting vajras have something to move against instead
  // of flat black. ?meteors is shooting stars per minute, ?stardrift scales
  // how fast the sky slides past (near stars cross in about ten minutes).
  let SKY_COUNT = Math.max(0, Math.min(1600, Math.round(num("stars", 0))));
  let SKY_METEORS = Math.max(0, num("meteors", 5));
  let SKY_DRIFT = Math.max(0, num("stardrift", 1));
  // Backdrop playback rate (?backspeed=): plain <img> gifs are locked to the
  // frame delays baked into the file, so to cycle faster we decode the gif
  // and drive it on a canvas at this multiplier (2 = twice as fast).
  let BACK_SPEED = Math.max(0.1, num("backspeed", 1));
  // Reveal zoom (?iriszoom=): as the iris opens, the backdrop gif is scaled
  // up about its centre so that by full open only the middle (the eye) fills
  // the aperture. 1 = no zoom; 2.5 = eye fills at iris=1.
  let IRIS_ZOOM = Math.max(1, num("iriszoom", 2.5));
  // Moon size (?moonscale=0.1..2): shrinks/grows the whole letterboxed render
  // - the disc, its backdrop and the vajra orbits all track it, since they
  // are positioned off the quad scale.
  let MOON_SCALE = Math.max(0.1, Math.min(2, num("moonscale", 1)));
  // Nudge the moon off centre by hand (?moonx=, ?moony=), in disc radii so it
  // means the same thing at any size and on any display - for squaring the
  // moon up to a fan hub or a projected frame by eye. The disc itself is
  // centred automatically and measured off the video's alpha; scripts/
  // probe-moon-framing.mjs reports how well, if it is ever in doubt.
  let MOON_DX = num("moonx", 0);
  let MOON_DY = num("moony", 0);
  // Iris reveal (?iris=0..1): opens a fully transparent circular hole in the
  // centre of the disc so the backdrop shows through while the moon's limb
  // stays as a rim. irisr = hole radius as a fraction of the disc radius
  // that is 100% clear when fully open; irisfeather = soft edge beyond it;
  // irissec = seconds for the eased open/close.
  let IRIS_TARGET = Math.max(0, Math.min(1, num("iris", 0)));
  let IRIS_R = num("irisr", 0.7);
  let IRIS_FEATHER = num("irisfeather", 0.22);
  let IRIS_SEC = Math.max(0.1, num("irissec", 2.5));
  // Blood moon (?bloodmoon=0..1, ?bloodtint=RRGGBB): grades the whole disc
  // render toward a copper-red eclipse color, preserving luminance so the
  // craters and the letter mosaic keep their relief. 0 = natural moon.
  let BLOOD_TINT = String(params.get("bloodtint") || "ff2c12").replace(/[^0-9a-fA-F]/g, "") || "ff2c12";
  let BLOOD_AMT = Math.max(0, Math.min(1, num("bloodmoon", 0)));
  // Timed fade (?bloodtarget=0..1&bloodfade=seconds): the render walks the
  // grade toward the target at full-scale/bloodfade per second - e.g.
  // bloodtarget=1&bloodfade=7200 reddens over a 2 h window. The fade runs in
  // this window, so the controller can be closed once it's started.
  let BLOOD_SEC = Math.max(0, num("bloodfade", 0));
  let BLOOD_TARGET = Math.max(0, Math.min(1, num("bloodtarget", BLOOD_AMT)));
  // Earth's shadow (?eclipse=0..1): the real thing rather than a grade. At
  // lunar distance the umbra is a disc about 2.6 moon radii across inside a
  // penumbra of 4.6, and the moon drifts through it along a chord — so
  // progress 0 is first contact on one side and 1 is last contact on the
  // other, with totality in the middle. ?eclipsepath is how centrally it
  // passes: 0 is dead through the middle, past ~1.6 it never goes total.
  // ?eclipsetarget + ?eclipserun (seconds) run the transit on a timer.
  let ECL_ON = params.has("eclipse") || params.has("eclipserun") || params.has("eclipsetarget");
  let ECL_P = Math.max(0, Math.min(1, num("eclipse", 0)));
  let ECL_TARGET = Math.max(0, Math.min(1, num("eclipsetarget", ECL_P)));
  let ECL_SEC = Math.max(0, num("eclipserun", 0));
  let ECL_PATH = Math.max(0, Math.min(3, num("eclipsepath", 0.35)));
  // ?eclipseevery= minutes between transits. The show runs unattended for
  // hours, so an eclipse is worth having as a recurring event rather than a
  // single pass that leaves the sky empty afterwards. 0 keeps it one-shot.
  let ECL_EVERY = Math.max(0, num("eclipseevery", 0));
  let eclNextAt = 0; // seconds since start; 0 = not yet scheduled
  // How far down totality goes. The real thing is far darker than this; a
  // show wants it the way eclipse photographs look, not the way the meter
  // reads. 1 is closest to true darkness, 0 leaves the moon plainly lit.
  let ECL_DEEP = Math.max(0, Math.min(1, num("eclipsedeep", 0.7)));
  const ECL_UMBRA = Math.max(1.05, num("eclipseumbra", 2.6));
  const ECL_PEN = Math.max(ECL_UMBRA + 0.2, num("eclipsepen", 4.6));

  // alpha:true so the canvas clears transparent and the gif backdrop shows
  // through wherever the moon isn't (or is faded via ?alpha=).
  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(1);
  renderer.domElement.style.position = "fixed";
  renderer.domElement.style.left = "0";
  renderer.domElement.style.top = "0";
  renderer.domElement.style.zIndex = "1";
  document.body.appendChild(renderer.domElement);

  // LAN broadcast of this canvas - startable at load (?stream=1) or live from
  // the controller's "stream to LAN" toggle, no reload.
  let streamStatus = "off";
  let streamSession = null;
  function setStreaming(on) {
    if (on && !streamSession && window.HypermuseStream) {
      streamSession = window.HypermuseStream.broadcast(renderer.domElement.captureStream(STREAM_FPS), {
        onStatus: (state, count) => { streamStatus = `${state} (${count} viewer${count === 1 ? "" : "s"})`; }
      });
    } else if (!on && streamSession) {
      streamSession.stop();
      streamSession = null;
      streamStatus = "off";
    }
  }
  if (STREAM) setStreaming(true);
  const scene = new THREE.Scene();
  scene.background = null; // transparent clear - the DOM backdrop shows through
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  function makeVideo(src) {
    const v = document.createElement("video");
    v.src = src;
    v.loop = true;
    v.muted = true;
    v.playsInline = true;
    v.play().catch(() => window.addEventListener("click", () => v.play(), { once: true }));
    const tex = new THREE.VideoTexture(v);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return { video: v, texture: tex };
  }

  const moon = makeVideo(MOON_SRC);
  moon.video.playbackRate = SPEED;
  let contentVideo = isVideoContent ? makeVideo(contentList[0]) : null;

  // Autoplay watchdog: if the browser refused muted autoplay (Safari, Low
  // Power Mode, some popup contexts) the whole scene freezes on frame 0 and
  // the word sits still. Keep retrying, accept any click/key as the gesture,
  // and show a hint while the moon is stuck.
  const playHint = document.createElement("div");
  playHint.textContent = "click to start the moon";
  playHint.style.cssText = "position:fixed;left:50%;bottom:8%;transform:translateX(-50%);" +
    "color:rgba(143,216,255,0.75);font:12px 'JetBrains Mono',Menlo,monospace;" +
    "letter-spacing:3px;text-transform:uppercase;display:none;z-index:5;pointer-events:none;";
  document.body.appendChild(playHint);
  let lastMoonTime = -1;
  setInterval(() => {
    const v = moon.video;
    const stuck = v.readyState >= 2 && (v.paused || v.currentTime === lastMoonTime);
    lastMoonTime = v.currentTime;
    playHint.style.display = (stuck && !SOLO) ? "block" : "none";
    if (stuck) v.play().catch(() => {});
  }, 1600);
  ["pointerdown", "keydown"].forEach((ev) => window.addEventListener(ev, () => {
    moon.video.play().catch(() => {});
    if (contentVideo) contentVideo.video.play().catch(() => {});
    vajraSprites.forEach((s) => { if (s.mesh.visible) s.video.play().catch(() => {}); });
    if (cave) cave.videos.forEach((v) => v.play().catch(() => {}));
    if (fold && fold.video) fold.video.play().catch(() => {});
    if (KIOSK && !document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }));
  if (KIOSK) document.body.style.cursor = "none";

  // --- Orbiting vajras (ported from hyperstition-moon-halo) ---------------
  // Additive-blended video sprites on tilted elliptical lanes around the
  // disc. ?vajras=0..6 sets the count, ?vajraradius= scales the orbit
  // (1 = skimming the limb); both are live-adjustable from the controller.
  const VAJRA_DIR = "loops/VAJRA DORJE ANIMATIONS";
  // The masters are 1080p/32Mbit; a sprite renders ~120px tall, and decoding
  // four or six masters at once tears them into macroblock garbage. Play the
  // 360p proxies (scripts/build-vajra-proxies.mjs) and fall back to the
  // master only if a proxy is missing on this machine.
  const VAJRA_WEB = VAJRA_DIR + "/web";
  // ROTATING 3 is excluded: its blue pedestal disc cannot be keyed additively.
  const VAJRA_NAMES = [
    "DORJE 3D ROTATING 1.mp4",
    "DORJE 3D ROTATING 2.mp4",
    "DORJE 3D ROTATING 4.mp4",
    "DORJE 3D ROTATING 5.mp4",
    "Hitem3d-1779724467167.mp4",
    "Hitem3d-1779724467167_2.mp4"
  ];
  const VAJRA_CLIPS = VAJRA_NAMES.map((n) => VAJRA_WEB + "/" + n);
  let VAJRA_COUNT = Math.max(0, Math.min(6, Math.round(num("vajras", 0))));
  let VAJRA_RADIUS = num("vajraradius", num("vajraRadius", 1.25));
  // How far a lane opens vertically, as a fraction of the disc radius. A
  // tilted circular orbit is closest to the disc centre on screen exactly
  // where it is deepest in front or behind, so this is what decides whether
  // the far half passes behind the moon at all: it has to stay inside the
  // limb. At 0 the lanes are edge-on and the sprites just slide across the
  // face; the default keeps every lane's turn well inside the disc.
  let VAJRA_TILT = Math.max(0.05, Math.min(1, num("vajratilt", num("vajraTilt", 0.75))));
  const VAJRA_SCALE = num("vajrascale", 0.17); // sprite height in frame-height units
  const vajraSprites = [];

  function makeVajraSprite(i) {
    const v = document.createElement("video");
    const name = VAJRA_NAMES[i % VAJRA_NAMES.length];
    v.src = VAJRA_WEB + "/" + name;
    v.addEventListener("error", () => {
      const master = VAJRA_DIR + "/" + name;
      if (v.src.indexOf("/web/") === -1) return;
      console.warn("vajra proxy missing, using master:", master);
      v.src = master;
      v.play().catch(() => {});
    });
    v.loop = true;
    v.muted = true;
    v.playsInline = true;
    const tex = new THREE.VideoTexture(v);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    // The clips are dorjes on black, so the black is keyed out by luminance
    // and the rest is composited premultiplied — a sprite in front of the
    // moon then covers the surface instead of adding light to it, which is
    // the difference between passing in front and being painted on. The far
    // half of the orbit is clipped per pixel against the disc silhouette, so
    // it is eaten by the limb on the way behind rather than fading out whole.
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: tex },
        uOpacity: { value: 0 },
        uBehind: { value: 0 },
        uCen: { value: new THREE.Vector2(0, 0) },
        uInv: { value: new THREE.Vector2(1, 1) },
        uR: { value: 0.5 }
      },
      transparent: true,
      depthTest: false,
      depthWrite: false,
      blending: THREE.NormalBlending,
      premultipliedAlpha: true,
      vertexShader: `
        varying vec2 vUv;
        varying vec2 vWorld;
        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorld = wp.xy;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform sampler2D map;
        uniform float uOpacity, uBehind, uR;
        uniform vec2 uCen, uInv;
        varying vec2 vUv;
        varying vec2 vWorld;
        void main() {
          vec4 c = texture2D(map, vUv);
          float luma = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
          float a = smoothstep(0.03, 0.20, luma) * uOpacity;
          if (uBehind > 0.5) {
            // Disc distance in frame-height units, the space the disc is
            // round in; the world quad is letterboxed so x and y differ.
            float d = length((vWorld - uCen) * uInv);
            a *= smoothstep(uR * 0.995, uR * 1.035, d);
          }
          if (a <= 0.001) discard;
          gl_FragColor = vec4(c.rgb * a, a);
        }
      `
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    mesh.renderOrder = 2; // over the fullscreen moon quad
    mesh.visible = false;
    scene.add(mesh);
    const sprite = {
      mesh, video: v, mat, aspect: 1,
      lane: i,
      phase: i * 1.9,
      speed: 0.34 + (i % 3) * 0.09
    };
    v.addEventListener("loadedmetadata", () => {
      sprite.aspect = (v.videoWidth || 1) / (v.videoHeight || 1);
    });
    return sprite;
  }

  function setVajraCount(n) {
    VAJRA_COUNT = Math.max(0, Math.min(VAJRA_CLIPS.length, Math.round(n) || 0));
    while (vajraSprites.length < VAJRA_COUNT) {
      vajraSprites.push(makeVajraSprite(vajraSprites.length));
    }
    vajraSprites.forEach((s, i) => {
      const on = i < VAJRA_COUNT;
      s.mesh.visible = on;
      if (on) s.video.play().catch(() => {});
      else s.video.pause();
    });
  }
  setVajraCount(VAJRA_COUNT);

  const smooth01 = (x, a, b) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };

  // --- Music sync -----------------------------------------------------------
  // Smoothed band levels (0..1) plus a decaying beat envelope. Fed either by
  // "moonAudio" messages from the controller's audio deck analyser, or by the
  // local microphone (for external / live music). Effects: vajras flare and
  // swell on bass beats, earthshine breathes with the bass, the window glow
  // shimmers with the highs, and the letter mosaic reshuffles faster when the
  // music is loud. All scaled by REACT (0 disables everything).
  const audio = {
    bass: 0, mid: 0, high: 0, level: 0,
    tBass: 0, tMid: 0, tHigh: 0, tLevel: 0, // targets from the last message
    beatEnv: 0, lastMsg: -Infinity
  };
  function feedAudio(bass, mid, high, level, beat) {
    audio.tBass = bass; audio.tMid = mid; audio.tHigh = high; audio.tLevel = level;
    audio.lastMsg = performance.now() / 1000;
    if (beat) audio.beatEnv = 1;
  }
  function updateAudio(dt) {
    const stale = performance.now() / 1000 - audio.lastMsg > 0.6;
    // Fast attack, slower release; everything sags to silence when the
    // feed stops so a dropped controller doesn't freeze a flare mid-air.
    for (const k of ["bass", "mid", "high", "level"]) {
      const target = stale ? 0 : audio["t" + k[0].toUpperCase() + k.slice(1)];
      const rate = target > audio[k] ? 22 : 5;
      audio[k] += (target - audio[k]) * Math.min(1, dt * rate);
    }
    audio.beatEnv = Math.max(0, audio.beatEnv - dt * 3.2);
  }

  // Local mic analysis, same band split the controller uses.
  let micNodes = null;
  function setMic(on) {
    MIC = !!on;
    if (!MIC || micNodes) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser();
      an.fftSize = 2048;
      an.smoothingTimeConstant = 0.3;
      src.connect(an);
      micNodes = { ctx, an, data: new Uint8Array(an.frequencyBinCount), hist: [], lastBeat: 0 };
    }).catch((e) => console.warn("mic unavailable:", e.message));
  }
  if (MIC) setMic(true);
  function pollMic() {
    if (!MIC || !micNodes) return;
    const { ctx, an, data, hist } = micNodes;
    if (ctx.state === "suspended") ctx.resume();
    an.getByteFrequencyData(data);
    const hz = ctx.sampleRate / an.fftSize;
    const band = (lo, hi) => {
      let sum = 0, n = 0;
      for (let i = Math.max(1, Math.floor(lo / hz)); i < Math.min(data.length, Math.ceil(hi / hz)); i++) { sum += data[i]; n++; }
      return n ? sum / (n * 255) : 0;
    };
    const bass = band(20, 150), mid = band(150, 2000), high = band(2000, 12000);
    // Average of PREVIOUS samples only, so sustained bass can't mask kicks.
    const avg = hist.length ? hist.reduce((a, b) => a + b, 0) / hist.length : 0;
    hist.push(bass);
    if (hist.length > 80) hist.shift(); // ~1.3 s at frame rate
    const now = performance.now() / 1000;
    let beat = false;
    if (bass > 0.12 && (bass > avg * 1.22 || bass - avg > 0.07) && now - micNodes.lastBeat > 0.18) {
      micNodes.lastBeat = now;
      beat = true;
    }
    feedAudio(bass, mid, high, (bass + mid + high) / 3, beat);
  }

  function updateVajras(t) {
    if (VAJRA_COUNT === 0) return;
    // Frame-height units -> world units (quad is letterboxed to 16:9).
    const fhX = 2 * quad.scale.x * (9 / 16);
    const fhY = 2 * quad.scale.y;
    const dv = uniforms.uDisc.value; // disc center (uv) + radius (frame heights)
    const cx = (dv.x * 2 - 1) * quad.scale.x + quad.position.x;
    const cy = (dv.y * 2 - 1) * quad.scale.y + quad.position.y;
    for (let i = 0; i < VAJRA_COUNT; i++) {
      const s = vajraSprites[i];
      const rx = dv.z * VAJRA_RADIUS * (1.03 + s.lane * 0.085);
      // Vertical opening is set against the disc, not against rx: outer
      // lanes swing wider at the sides but still turn inside the limb, so
      // every lane passes behind the moon rather than only the innermost.
      const ry = dv.z * Math.min(0.9, VAJRA_TILT * (0.45 + s.lane * 0.07));
      const laneRot = (s.lane - (VAJRA_COUNT - 1) / 2) * 0.14;
      const th = s.phase + t * s.speed;
      const depth = Math.sin(th); // > 0 = in front of the moon
      const ex = Math.cos(th) * rx;
      const ey = Math.sin(th) * ry;
      const px = ex * Math.cos(laneRot) - ey * Math.sin(laneRot);
      const py = ex * Math.sin(laneRot) + ey * Math.cos(laneRot);
      // Bass flare: the beat envelope swells each vajra (staggered per lane
      // so they don't pop in lockstep) and the sustained bass adds glow.
      const flare = REACT * (audio.beatEnv * (0.75 + 0.25 * Math.sin(s.phase * 3.7)) + audio.bass * 0.35);
      const scl = VAJRA_SCALE * (0.68 + 0.32 * (depth * 0.5 + 0.5)) * (1 + flare * 0.22);
      s.mesh.position.set(cx + px * fhX, cy + py * fhY, 0);
      s.mesh.scale.set(scl * s.aspect * fhX, scl * fhY, 1);
      const op = 0.5 + 0.5 * (depth * 0.5 + 0.5);
      const u = s.mat.uniforms;
      u.uOpacity.value = Math.min(1, op * (1 + flare * 0.9));
      // The far half is clipped by the disc in the fragment shader, which
      // needs the disc in world space plus the letterbox scale to undo.
      u.uBehind.value = depth < 0 ? 1 : 0;
      u.uCen.value.set(cx, cy);
      u.uInv.value.set(1 / fhX, 1 / fhY);
      u.uR.value = dv.z;
    }
  }

  // --- Flashed mark --------------------------------------------------------
  // One additive quad seated on the disc, dark for a minute at a time. Sized
  // against the disc rather than the frame, so a circular mark at flashscale 1
  // lands on the limb and the moon reads as briefly becoming the mark.
  function makeFlashMark(src) {
    const mat = new THREE.ShaderMaterial({
      uniforms: { map: { value: null }, uOpacity: { value: 0 }, uGain: { value: 1 } },
      transparent: true,
      depthTest: false,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      // Premultiplied against a solid alpha: additive takes the colour and
      // ignores what it was drawn on, so a mark with an alpha channel and a
      // mark on a black plate both arrive the same way.
      fragmentShader: `
        uniform sampler2D map;
        uniform float uOpacity, uGain;
        varying vec2 vUv;
        void main() {
          vec4 c = texture2D(map, vUv);
          gl_FragColor = vec4(c.rgb * c.a * uOpacity * uGain, 1.0);
        }
      `
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    mesh.renderOrder = 3; // over the moon quad and the orbiting sprites
    mesh.visible = false;
    scene.add(mesh);
    const mark = { mesh, mat, aspect: 1, ready: false };
    new THREE.TextureLoader().load(src, (tex) => {
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      mat.uniforms.map.value = tex;
      const im = tex.image;
      if (im && im.width && im.height) mark.aspect = im.width / im.height;
      mark.ready = true;
    }, undefined, () => console.warn("[flash] could not load " + src));
    return mark;
  }

  // Rise, hold, fall, then nothing until the next period comes round. The
  // cycle is taken off the show clock rather than counted between frames, so
  // an hour in it is still landing on the minute.
  function updateFlash(t) {
    if (!flashMark) return;
    const span = FLASH_HOLD + FLASH_FADE * 2;
    const u = t % Math.max(span, FLASH_SEC);
    const level = u >= span ? 0
      : FLASH_FADE <= 0 ? 1
      : Math.max(0, Math.min(1, Math.min(u, span - u) / FLASH_FADE));
    // Set before the visibility bail-out, or a hidden mark keeps reporting
    // whatever strength it was at when it went out.
    flashMark.mat.uniforms.uOpacity.value = level;
    flashMark.mat.uniforms.uGain.value = FLASH_GAIN;
    flashMark.mesh.visible = flashMark.ready && level > 0.002;
    if (!flashMark.mesh.visible) return;
    // Frame-height units -> world units, the same conversion the vajra lanes
    // and the gif orbiters make.
    const fhX = 2 * quad.scale.x * (9 / 16);
    const fhY = 2 * quad.scale.y;
    const dv = uniforms.uDisc.value; // disc centre (uv) + radius (frame heights)
    const cx = (dv.x * 2 - 1) * quad.scale.x + quad.position.x;
    const cy = (dv.y * 2 - 1) * quad.scale.y + quad.position.y;
    const s = 2 * dv.z * FLASH_SCALE;
    flashMark.mesh.position.set(cx, cy, 0);
    flashMark.mesh.scale.set(s * flashMark.aspect * fhX, s * fhY, 1);
  }

  // Image slideshow: preload all, swap the content texture on a timer.
  let imageTextures = [];
  if (isImageContent) {
    const loader = new THREE.TextureLoader();
    imageTextures = contentList.map((src) => {
      const tex = loader.load(src);
      tex.minFilter = THREE.LinearFilter;
      return tex;
    });
  }

  // --- In-page window content generators ----------------------------------

  // Live CRT terminal (content=crt): green phosphor, typewriter, scanlines.
  // The announced time (WHEN) is editable live from the controller.
  function makeCrtTexture() {
    const W = 1024, H = 640;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    const tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    const CPS = num("cps", 17); // typed characters per second
    const HOLD = 3.2;           // seconds a finished screen stays up
    let frames = [];
    function buildFrames() {
      // Short lines on purpose: the auto-fit sizes type to the longest line,
      // so terse screens render roughly twice as large through the window.
      frames = [
        ["> CARRIER LOCKED", "", "HYPERSTITION", "", WHEN],
        ["RECITE THE OATH:", "OM VAJRASATTVAH", "SVAYAM TE 'DYA", "HRDAYE", "SAMAVASTHITAH"],
        ["VISUALIZE", "THE MOON", "SOAR UP INTO", "EMPTY SPACE"],
        ["ASCEND THE", "LUNAR DISC", "ADAMANTINE GEM", "", WHEN],
        ["VAJRAM AHAM", "", "(I AM A VAJRA)"]
      ];
    }
    buildFrames();
    let frameIdx = 0, frameStart = 0, started = false;
    function draw(t) {
      if (!started) { started = true; frameStart = t; }
      const lines = frames[frameIdx % frames.length];
      const totalChars = lines.reduce((a, l) => a + l.length + 1, 0);
      const shown = Math.floor((t - frameStart) * CPS);
      if (shown > totalChars + HOLD * CPS) {
        frameIdx++;
        frameStart = t;
        return draw(t);
      }
      ctx.fillStyle = "#020703";
      ctx.fillRect(0, 0, W, H);
      // Readability through the window: aim big (2x the old 44px) and
      // shrink per frame only as far as the longest line / line count force.
      let fs = 88;
      const setFont = () => { ctx.font = `bold ${fs}px "JetBrains Mono", "Menlo", monospace`; };
      setFont();
      const maxW = () => Math.max(...lines.map((l) => ctx.measureText(l).width));
      while (fs > 30 && (maxW() > W * 0.84 || lines.length * fs * 1.5 > H * 0.82)) {
        fs -= 2;
        setFont();
      }
      ctx.textBaseline = "top";
      ctx.shadowColor = "#2bff62";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#49ff7d";
      let budget = shown;
      const lineStep = fs * 1.5;
      const y0 = Math.max(H * 0.06, (H - lines.length * lineStep) / 2);
      // Lines are centered so the window's cover-crop trims both margins
      // symmetrically instead of eating the start of every line.
      lines.forEach((line, i) => {
        if (budget <= 0) return;
        const part = line.slice(0, budget);
        budget -= line.length + 1;
        const x0 = (W - ctx.measureText(line).width) / 2;
        ctx.fillText(part, x0, y0 + i * lineStep);
        if (budget <= 0 && Math.floor(t * 2.4) % 2 === 0) {
          ctx.fillRect(x0 + ctx.measureText(part).width + 8, y0 + i * lineStep, fs * 0.55, fs * 0.9);
        }
      });
      ctx.shadowBlur = 0;
      // Scanlines + slow roll bar.
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 2);
      const rollY = ((t * 26) % (H * 1.4)) - H * 0.2;
      const roll = ctx.createLinearGradient(0, rollY, 0, rollY + H * 0.16);
      roll.addColorStop(0, "rgba(120,255,160,0)");
      roll.addColorStop(0.5, "rgba(120,255,160,0.07)");
      roll.addColorStop(1, "rgba(120,255,160,0)");
      ctx.fillStyle = roll;
      ctx.fillRect(0, rollY, W, H * 0.16);
      tex.needsUpdate = true;
    }
    return {
      texture: tex, draw, aspect: W / H,
      setWhen() { buildFrames(); }
    };
  }

  // Vajra cave (content=vajra): spinning dorje clips drifting in a
  // violet-lit hollow, composited additively on an offscreen canvas.
  function makeVajraCave() {
    const W = 768, H = 448;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    const tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    const videos = [0, 1, 4].map((ci) => {
      const v = document.createElement("video");
      v.src = VAJRA_CLIPS[ci % VAJRA_CLIPS.length];
      v.loop = true;
      v.muted = true;
      v.playsInline = true;
      v.play().catch(() => {});
      return v;
    });
    function draw(t) {
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#060312";
      ctx.fillRect(0, 0, W, H);
      const glow = ctx.createRadialGradient(W / 2, H / 2, H * 0.1, W / 2, H / 2, H * 0.75);
      glow.addColorStop(0, "rgba(130,80,220,0.35)");
      glow.addColorStop(1, "rgba(130,80,220,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";
      videos.forEach((v, i) => {
        if (v.readyState < 2) return;
        const va = (v.videoWidth || 1) / (v.videoHeight || 1);
        const s = H * (0.62 + 0.10 * Math.sin(t * 0.23 + i * 2.4));
        const x = W / 2 + Math.sin(t * 0.13 + i * 2.1) * W * 0.24;
        const y = H / 2 + Math.cos(t * 0.11 + i * 1.7) * H * 0.16;
        ctx.drawImage(v, x - s * va / 2, y - s / 2, s * va, s);
      });
      ctx.globalCompositeOperation = "source-over";
      tex.needsUpdate = true;
    }
    return { texture: tex, draw, videos, aspect: W / H };
  }

  // Incantation (content=incant): mantra phrases from the Adamantine
  // Pinnacle Sutra surface one at a time, a new phrase per apparition.
  const INCANT_PHRASES = [
    "OM VAJRASATTVAH SVAYAM", "TE 'DYA HRDAYE", "SAMAVASTHITAH",
    "VAJRA VAJRA", "SUDDHA SUDDHA", "SATTVA SATTVA", "BUDDHA BUDDHA",
    "VAJRAJALA", "VAJRARUPA", "VAJRAKASA", "VAJRAM AHAM", "I AM A VAJRA"
  ];
  function makeIncantTexture() {
    const W = 1024, H = 512;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    const tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    let idx = 0;
    function redraw() {
      ctx.clearRect(0, 0, W, H);
      const phrase = INCANT_PHRASES[idx % INCANT_PHRASES.length];
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      let fs = 190;
      ctx.font = `bold ${fs}px "JetBrains Mono", "Menlo", monospace`;
      while (ctx.measureText(phrase).width > W * 0.9 && fs > 30) {
        fs -= 4;
        ctx.font = `bold ${fs}px "JetBrains Mono", "Menlo", monospace`;
      }
      ctx.shadowColor = "#c9a3ff";
      ctx.shadowBlur = 26;
      ctx.fillStyle = "#f3e9ff";
      ctx.fillText(phrase, W / 2, H / 2);
      ctx.shadowBlur = 0;
      tex.needsUpdate = true;
    }
    redraw();
    return {
      texture: tex, aspect: W / H,
      advance() { idx++; redraw(); }
    };
  }

  // Dancing mumins (content=mumins): a chorus line of little round trolls
  // hopping across the window, drawn procedurally so there is no asset to
  // ship and the troupe can be resized live. Everything is painted on a
  // transparent canvas because the shader adds the window texture as glow —
  // so the bodies luminesce on the dark side and the eyes are punched back
  // out with destination-out to read as holes.
  const MUMIN_COUNT = Math.max(1, Math.min(9, Math.round(num("mumins", 3))));
  const MUMIN_BPM = Math.max(20, num("muminbpm", 100));
  // The window samples the middle of the content canvas rather than all of
  // it, so a troupe drawn to the full canvas comes out cropped to one huge
  // dancer. ?muminzoom= pulls the ring in until the whole line fits.
  const MUMIN_ZOOM = Math.max(0.15, Math.min(1.5, num("muminzoom", 0.42)));
  function makeMumins() {
    // Square canvas with the troupe in a middle band: the window cover-crops
    // to its own box, so the empty margins get trimmed instead of the line.
    const W = 1024, H = 1024;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    const tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    // Pale moon-milk tints, one per dancer, so the line reads as a troupe.
    const TINTS = ["#fdf5e7", "#e6f1ff", "#ffe6f0", "#e8fff2", "#fff4d6", "#f0e8ff", "#e6fbff", "#fff0e0", "#f6ffe6"];

    function limb(x0, y0, x1, y1, r) {
      ctx.beginPath();
      ctx.lineCap = "round";
      ctx.lineWidth = r * 2;
      ctx.strokeStyle = ctx.fillStyle;
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
    function blob(x, y, rx, ry, rot) {
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // One dancer, drawn about its own feet at (cx, cy). ph drives the whole
    // step: hop, lean, arm swing and the alternating kick.
    function drawMumin(cx, cy, s, ph, tint, faceLeft) {
      const hop = Math.abs(Math.sin(ph)) * 0.16 * s;
      const lean = Math.sin(ph * 0.5) * 0.15;
      const squash = 1 + 0.07 * Math.sin(ph * 2);
      const swing = Math.sin(ph);
      ctx.save();
      ctx.translate(cx, cy - hop);
      ctx.rotate(lean * 0.3);
      if (faceLeft) ctx.scale(-1, 1);
      ctx.scale(1 / squash, squash);
      ctx.fillStyle = tint;
      // legs kick alternately, so the troupe looks like it is stepping
      limb(-0.11 * s, -0.30 * s, -0.15 * s + swing * 0.10 * s, -0.02 * s + Math.max(0, swing) * -0.10 * s, 0.075 * s);
      limb(0.11 * s, -0.30 * s, 0.15 * s - swing * 0.10 * s, -0.02 * s + Math.max(0, -swing) * -0.10 * s, 0.075 * s);
      // arms swing opposite the legs, thrown up on the beat
      limb(-0.27 * s, -0.62 * s, -0.44 * s, -0.62 * s - swing * 0.22 * s, 0.065 * s);
      limb(0.27 * s, -0.62 * s, 0.44 * s, -0.62 * s + swing * 0.22 * s, 0.065 * s);
      // pear body, round head, and the big snout that makes the silhouette
      blob(0, -0.46 * s, 0.30 * s, 0.34 * s);
      blob(0, -0.92 * s, 0.29 * s, 0.27 * s);
      blob(0.17 * s, -0.86 * s, 0.25 * s, 0.17 * s);
      // ears
      blob(-0.16 * s, -1.14 * s, 0.075 * s, 0.11 * s, -0.35);
      blob(0.11 * s, -1.16 * s, 0.075 * s, 0.11 * s, 0.25);
      // little tail
      limb(-0.27 * s, -0.42 * s, -0.38 * s, -0.34 * s, 0.045 * s);
      // eyes punched out of the glow
      ctx.globalCompositeOperation = "destination-out";
      blob(0.02 * s, -0.98 * s, 0.035 * s, 0.05 * s);
      blob(0.17 * s, -1.00 * s, 0.035 * s, 0.05 * s);
      ctx.globalCompositeOperation = "source-over";
      ctx.restore();
    }

    // A ring dance rather than a chorus line: the troupe stays compact in the
    // middle of the frame, so the window's cover-crop can't cut half of it
    // off however the shadow patch is shaped.
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      const beat = t * (MUMIN_BPM / 60) * Math.PI * 2;
      const spin = t * 0.3;
      const R = W * 0.24 * MUMIN_ZOOM, cx = W / 2, cy = H * 0.5;
      const base = Math.min(H * 0.34, (W / (MUMIN_COUNT + 1.1)) * 1.15) * MUMIN_ZOOM;
      const ring = [];
      for (let i = 0; i < MUMIN_COUNT; i++) {
        ring.push({ i, a: spin + i * (Math.PI * 2 / MUMIN_COUNT) });
      }
      // paint back to front so the near dancers overlap the far ones
      ring.sort((p, q) => Math.sin(p.a) - Math.sin(q.a));
      for (const d of ring) {
        const near = Math.sin(d.a) * 0.5 + 0.5;
        drawMumin(
          cx + Math.cos(d.a) * R,
          cy + Math.sin(d.a) * R * 0.34 + base * 0.5,
          base * (0.82 + 0.3 * near),
          beat - d.i * 0.7,
          TINTS[d.i % TINTS.length],
          Math.cos(d.a) > 0 // dancers on the right face back into the circle
        );
      }
      tex.needsUpdate = true;
    }
    draw(0);
    return { texture: tex, draw, aspect: W / H };
  }

  // GifCities swarm (content=gifswarm): the animated GIFs that furnished
  // GeoCities homepages, rescued by the Internet Archive and set loose on the
  // dark side as a field of coupled oscillators. Run scripts/scrape-gifcities.mjs
  // to fill assets/gifcities/ first; without it the swarm quietly draws nothing.
  //
  // Each GIF orbits its own little circle, and the angle it sits at is its
  // Kuramoto phase. While the phases are scattered the field is noise. As the
  // coupling climbs past critical they pull each other into step, and because
  // every sprite is then at the same point of its own orbit the whole swarm
  // visibly starts breathing as one thing. Once it is coherent it collapses
  // onto the lit cells of a word, holds it, and scatters. The sync is emergent
  // rather than keyframed, so the moment it locks lands somewhere new each pass.
  const GIF_INDEX = "assets/gifcities/index.json";
  const GIF_STARTER_INDEX = STARTER + "/gifs/index.json";
  const GIF_THEME = (params.get("giftheme") || "").trim().toLowerCase();
  // Enough to fill the lit cells of a short word with a little overlap, and
  // few enough that while they are scattered you can still see that each one
  // is a lava lamp or an eyeball rather than a glowing speck.
  // A short word's lit cells number well over a hundred, and letters only read
  // as letters when there are enough bodies to crowd every cell of them.
  const GIF_N = ORBIT_ONLY ? 0 : Math.max(12, Math.min(400, Math.round(num("gifs", 240))));
  const GIF_K = num("gifk", 2.6);              // coupling; critical is near 1.4
  const GIF_SPREAD = num("gifspread", 1.1);    // half-width of natural frequencies
  const GIF_SEC = Math.max(8, num("gifsec", 22));  // seconds per word
  // The opening fades from its middle outwards, so a word taken right out to
  // the edges of it loses its first and last letters to the falloff. Keeping
  // the block inside two thirds costs size but the whole of it reads.
  const GIF_ZOOM = Math.max(0.2, Math.min(1.2, num("gifzoom", 0.62)));
  // An entry with no letters in it — "-" is the obvious one to type — is a
  // rest: that phrase stays scattered and never gathers. gifwords=hermes,-,-
  // is how you get a swarm that only occasionally says something.
  const GIF_WORDS = (params.get("gifwords") || "muse,moon,love")
    .split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
  // A few of the swarm break out of the window and take the vajras' tilted
  // lanes round the disc — in front on the near half, eaten by the limb on the
  // way behind. The window is a patch of texture on the sphere and can never
  // cross the silhouette, so this is the only way a gif gets to orbit.
  const GIF_ORBIT = Math.max(0, Math.min(12, Math.round(num("giforbit", 5))));
  const GIF_ORBIT_R = num("giforbitradius", 1.2);   // 1 = skimming the limb
  const GIF_ORBIT_SCALE = num("giforbitscale", 0.12); // frame-height units
  // Laps an orbiter keeps its gif for before taking another out of the pool
  // (0 = it keeps whatever it was dealt for the whole act). The change is made
  // at the deepest point behind the moon, where the sprite is inside the
  // silhouette and clipped away, so nobody ever watches one gif cut to
  // another — the same courtesy the guest marks on the letter panel observe.
  const GIF_ORBIT_SWAP = Math.max(0, Math.round(num("giforbitswap", 1)));
  // The acts of the orbit (?orbitseq=coral,seaweed|ankh), "|" between them,
  // each act a list of themes to draw from and each holding for orbitact
  // seconds before handing on. Between acts the layer dissolves out, the pool
  // is rebuilt from the next act's themes, and it dissolves back in: an act
  // change is a moment in the show and is allowed to be seen, but the pool is
  // only ever torn down and rebuilt while there is nothing on screen to tear,
  // so it is still never a cut. One act, or none, is the fixed orbit as before.
  const ORBIT_SEQ = (params.get("orbitseq") || "")
    .split("|").map((s) => s.trim().toLowerCase()).filter(Boolean);
  const ORBIT_ACT = Math.max(4, num("orbitact", 150));
  const ORBIT_FADE = Math.max(0.1, num("orbitfade", 1.2));

  // Rejections and favourites made in gif-curator.html. curation.json is the
  // copy that travels with the library; localStorage is what the curator writes
  // as you click, and being same-origin it is visible here, so triage on this
  // machine takes effect on the next act without a file being moved anywhere.
  const GIF_MARKS_KEY = "hypermoon.gifcities.marks";
  async function loadGifMarks() {
    let marks = {};
    try {
      const r = await fetch("assets/gifcities/curation.json");
      if (r.ok) marks = await r.json();
    } catch { /* none shipped with the library */ }
    try {
      const local = JSON.parse(localStorage.getItem(GIF_MARKS_KEY) || "null");
      if (local) marks = Object.assign(marks, local);
    } catch { /* unreadable, stick with the file */ }
    return marks;
  }

  // Pulls every frame out of an animated GIF as an ImageBitmap. Same WebCodecs
  // path the backdrop layer uses, factored out so the swarm can hold dozens.
  async function decodeGifFrames(src) {
    if (!("ImageDecoder" in window)) return null;
    const resp = await fetch(src);
    if (!resp.ok) return null;
    const dec = new ImageDecoder({
      data: await resp.arrayBuffer(),
      type: resp.headers.get("content-type") || "image/gif"
    });
    await dec.tracks.ready;
    const count = dec.tracks.selectedTrack.frameCount || 1;
    const frames = [];
    for (let f = 0; f < count; f++) {
      const { image } = await dec.decode({ frameIndex: f });
      frames.push({ bmp: await createImageBitmap(image), dur: (image.duration || 100000) / 1000 });
      image.close();
    }
    return frames.length ? frames : null;
  }

  // Trimmed frames are canvases, untrimmed ones are bitmaps that hold memory
  // until closed — and a sequence builds a fresh pool every act, so a leak
  // here is a leak once every couple of minutes for the length of the show.
  const closeFrames = (f) => f.forEach((fr) => { if (fr.bmp.close) fr.bmp.close(); });

  // GeoCities GIFs are a mixed bag: some carry a transparent index, plenty are
  // just pasted onto a flat white or black rectangle by whoever made them. Left
  // alone the flat ones read as solid tiles rather than shapes, and a swarm of
  // tiles is a mosaic, not a swarm. So a GIF that holds back none of its own
  // frame has its background colour read off the corners, knocked out of every
  // frame, and what survives cropped to fit. If that cannot be done — the
  // corners disagree, or knocking the colour out takes the subject with it —
  // null goes back and the pool skips the GIF. There are always more GIFs than
  // orbit slots, so a rectangle is never worth flying.
  async function trimGifFrames(frames) {
    const w = frames[0].bmp.width, h = frames[0].bmp.height;
    if (!w || !h) return frames;
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const cx = c.getContext("2d", { willReadFrequently: true });

    cx.drawImage(frames[0].bmp, 0, 0);
    const first = cx.getImageData(0, 0, w, h).data;
    const at = (x, y) => { const i = (y * w + x) * 4; return [first[i], first[i + 1], first[i + 2], first[i + 3]]; };
    const corners = [at(0, 0), at(w - 1, 0), at(0, h - 1), at(w - 1, h - 1)];
    const near = (a, b) => Math.abs(a[0] - b[0]) < 22 && Math.abs(a[1] - b[1]) < 22 && Math.abs(a[2] - b[2]) < 22;
    const drop = () => { closeFrames(frames); return null; };
    // A cut-out holds back a real share of the box it occupies. Measured
    // against the box and not the whole frame, because a white card sitting in
    // a wide transparent margin has plenty of clear pixels and is still a card.
    const CLEAR = 0.12;
    let ax0 = w, ay0 = h, ax1 = -1, ay1 = -1, on = 0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (first[(y * w + x) * 4 + 3] <= 8) continue;
        on++;
        if (x < ax0) ax0 = x;
        if (y < ay0) ay0 = y;
        if (x > ax1) ax1 = x;
        if (y > ay1) ay1 = y;
      }
    }
    // Already a shape in its own right: leave it exactly as it is.
    if (ax1 >= ax0 && on <= (ax1 - ax0 + 1) * (ay1 - ay0 + 1) * (1 - CLEAR)) return frames;

    // Three corners of the same colour is a background; two is a coincidence.
    // Only opaque corners can be a background colour: a transparent corner
    // carries whatever RGB the encoder left under it, usually black, and
    // keying on that would knock the line art out of the middle of the gif.
    const solid = corners.filter((o) => o[3] >= 8);
    let key = null;
    for (const cand of solid) {
      if (solid.filter((o) => near(cand, o)).length >= 3) { key = cand; break; }
    }
    if (!key) return drop();

    const keyed = [];
    let x0 = w, y0 = h, x1 = -1, y1 = -1, kept = 0;
    for (const f of frames) {
      cx.clearRect(0, 0, w, h);
      cx.drawImage(f.bmp, 0, 0);
      const img = cx.getImageData(0, 0, w, h);
      const d = img.data;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          if (d[i + 3] > 8 && !near([d[i], d[i + 1], d[i + 2]], key)) {
            kept++;
            if (x < x0) x0 = x;
            if (y < y0) y0 = y;
            if (x > x1) x1 = x;
            if (y > y1) y1 = y;
          } else {
            d[i + 3] = 0;
          }
        }
      }
      keyed.push(img);
    }
    // Knocking out almost everything means the corners were the subject, not
    // the background — a solid heart filling its own frame, say. Which is a
    // rectangle too, so it goes the same way.
    if (x1 < x0 || kept < w * h * frames.length * 0.04) return drop();

    // Cropped canvases rather than bitmaps: drawImage takes either, and
    // createImageBitmap is an async round trip per frame that adds up over a
    // few dozen gifs. putImageData with a negative offset does the crop.
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    // The crop throws the cleared margin away, so the question is whether what
    // is left holds back part of its own box. A bevelled plaque loses its frame
    // line to the key and keeps the whole interior: still a tile, so drop it.
    if (kept > bw * bh * frames.length * (1 - CLEAR)) return drop();
    const out = keyed.map((img, i) => {
      const fc = document.createElement("canvas");
      fc.width = bw; fc.height = bh;
      fc.getContext("2d").putImageData(img, -x0, -y0);
      return { bmp: fc, dur: frames[i].dur };
    });
    frames.forEach((f) => f.bmp.close());
    return out;
  }

  function makeGifSwarm(themeArg) {
    // A sequence names its own themes, act by act, so it leads; a bare theme is
    // the one-act case of the same thing.
    const theme = (ORBIT_SEQ.length ? ORBIT_SEQ[0] : (themeArg || GIF_THEME || "")).trim().toLowerCase();
    const W = 1024, H = 1024;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    const tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;

    const sources = [];            // decoded GIFs, shared between sprites
    const srcs = [];               // where each came from, for curation passes
    const sprites = [];
    let dead = false, phrase = -1, cells = [];

    // The window cover-crops whatever it is given to the shape of its opening,
    // and the opening is wide and short: a square canvas has a band through the
    // middle taken out of it and the rest is never seen. Laying out against the
    // full canvas therefore threw most of the swarm away and left the word a
    // sixth of the height it could have been. VW/VH are the part that survives,
    // measured against the live box the same way the shader crops it.
    let VW = W, VH = H;
    function measureView() {
      const ang = uniforms.uAng.value;
      const box = Math.max(0.3, (ang.x / Math.max(0.05, ang.y)) * 0.72);
      const src = W / H;
      const nw = src > box ? H * box : W;
      const nh = src > box ? H : W / box;
      if (Math.abs(nw - VW) < 3 && Math.abs(nh - VH) < 3) return false;
      VW = nw; VH = nh;
      return true;
    }

    // Homes on a golden-angle spiral, which covers the opening evenly without
    // the clumping a random scatter gives you at these counts.
    function layoutHomes() {
      for (let i = 0; i < sprites.length; i++) {
        const r = Math.sqrt((i + 0.5) / sprites.length);
        const a = i * 2.399963;
        const s = sprites[i];
        s.hx = W / 2 + Math.cos(a) * r * VW * 0.44;
        s.hy = H / 2 + Math.sin(a) * r * VH * 0.44;
        s.orbit = VH * s.orbitF;
      }
    }
    for (let i = 0; i < GIF_N; i++) {
      sprites.push({
        hx: W / 2, hy: H / 2,
        x: W / 2, y: H / 2, tx: W / 2, ty: H / 2,
        theta: Math.random() * Math.PI * 2,
        omega: (Math.random() * 2 - 1) * GIF_SPREAD,
        orbitF: 0.06 + Math.random() * 0.07, // of the opening's height
        orbit: 0,
        sz: 0.7 + Math.random() * 0.7,
        jx: (Math.random() * 2 - 1), jy: (Math.random() * 2 - 1),
        src: 0, frame: 0, acc: 0
      });
    }
    layoutHomes();
    // Sprites migrate in reading order, so the word assembles left to right
    // rather than every GIF taking the shortest diagonal across everything else.
    const order = sprites.map((_, i) => i).sort((a, b) => sprites[a].hx - sprites[b].hx);

    // The escapees: quads in the main scene rather than pixels in the window
    // texture, on the same lane geometry the vajras fly, so they read as the
    // same kind of object moving in the same space.
    function makeOrbiter(i) {
      // Fixed size, and each frame is stretched to fill it: resizing the canvas
      // leaves three uploading a sub-rectangle against the old dimensions, and
      // the quad is scaled by the gif's real aspect anyway, so the stretch is
      // undone on the way to the screen.
      const cv = document.createElement("canvas");
      cv.width = cv.height = 128;
      const g = cv.getContext("2d");
      const otex = new THREE.CanvasTexture(cv);
      otex.minFilter = THREE.LinearFilter;
      otex.magFilter = THREE.LinearFilter;
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          map: { value: otex },
          uOpacity: { value: 0 },
          uBehind: { value: 0 },
          uCen: { value: new THREE.Vector2(0, 0) },
          uInv: { value: new THREE.Vector2(1, 1) },
          uR: { value: 0.5 }
        },
        transparent: true,
        depthTest: false,
        depthWrite: false,
        blending: THREE.NormalBlending,
        premultipliedAlpha: true,
        vertexShader: `
          varying vec2 vUv;
          varying vec2 vWorld;
          void main() {
            vUv = uv;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorld = wp.xy;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform sampler2D map;
          uniform float uOpacity, uBehind, uR;
          uniform vec2 uCen, uInv;
          varying vec2 vUv;
          varying vec2 vWorld;
          void main() {
            vec4 c = texture2D(map, vUv);
            // Keyed gifs carry their own alpha; the luminance gate is for the
            // ones whose backing plate could not be read off the corners,
            // which would otherwise orbit as a black tile.
            float luma = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
            float a = c.a * smoothstep(0.02, 0.10, luma) * uOpacity;
            if (uBehind > 0.5) {
              float d = length((vWorld - uCen) * uInv);
              a *= smoothstep(uR * 0.995, uR * 1.035, d);
            }
            if (a <= 0.001) discard;
            gl_FragColor = vec4(c.rgb * a, a);
          }
        `
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
      mesh.renderOrder = 2; // over the fullscreen moon quad
      mesh.visible = false;
      scene.add(mesh);
      return {
        mesh, mat, tex: otex, canvas: cv, ctx: g, aspect: 1,
        lane: i, phase: i * 1.9 + Math.random() * 0.6,
        speed: 0.22 + (i % 3) * 0.07,
        src: i, frame: 0, acc: 0,
        lap: null, laps: 0
      };
    }
    const orbiters = Array.from({ length: GIF_ORBIT }, (_, i) => makeOrbiter(i));
    // Where the next hand-over takes its gif from. Shared, so two orbiters
    // changing at the same moment do not both reach for the same one.
    let orbitCursor = GIF_ORBIT;

    // Where the sequence has got to. "hold" runs the act out, "out" dissolves
    // the layer away, "wait" sits dark while the next act's gifs decode, "in"
    // brings it back up. seqLevel is the whole layer's opacity throughout, and
    // the swap happens at the bottom of it where there is nothing to see.
    let seqAct = 0, seqPhase = "hold", seqLevel = 1, seqAt = 0, seqWaitAt = 0;
    function updateSequence(t, dt) {
      if (ORBIT_SEQ.length < 2) return;
      if (seqPhase === "hold") {
        if (t - seqAt >= ORBIT_ACT) seqPhase = "out";
      } else if (seqPhase === "out") {
        seqLevel = Math.max(0, seqLevel - dt / ORBIT_FADE);
        if (seqLevel > 0) return;
        seqAct = (seqAct + 1) % ORBIT_SEQ.length;
        sources.forEach(closeFrames);
        sources.length = 0;
        srcs.length = 0;
        // An empty pool makes drawOrbiters give up early, so the lanes are put
        // out by hand here — otherwise they would sit through the decode wearing
        // the last frame of the act that just ended.
        orbiters.forEach((o) => {
          o.frame = 0; o.acc = 0; o.lap = null; o.laps = 0;
          o.mesh.visible = false;
          o.mat.uniforms.uOpacity.value = 0;
        });
        orbitCursor = GIF_ORBIT;
        loadPool(ORBIT_SEQ[seqAct]);
        seqPhase = "wait";
        seqWaitAt = t;
      } else if (seqPhase === "wait") {
        // Enough of the act landed that the orbit comes back inhabited rather
        // than as one gif in every lane. The timeout is for the act that cannot
        // decode at all: a sparse orbit beats a layer that never returns.
        if (sources.length >= Math.min(GIF_ORBIT, 4) || t - seqWaitAt > 20) seqPhase = "in";
      } else {
        seqLevel = Math.min(1, seqLevel + dt / ORBIT_FADE);
        if (seqLevel >= 1) { seqPhase = "hold"; seqAt = t; }
      }
    }

    function drawOrbiters(t, dt) {
      if (!orbiters.length || !sources.length) return;
      // Frame-height units -> world units (the quad is letterboxed to 16:9).
      const fhX = 2 * quad.scale.x * (9 / 16);
      const fhY = 2 * quad.scale.y;
      const dv = uniforms.uDisc.value; // disc centre (uv) + radius (frame heights)
      const ccx = (dv.x * 2 - 1) * quad.scale.x + quad.position.x;
      const ccy = (dv.y * 2 - 1) * quad.scale.y + quad.position.y;
      for (const o of orbiters) {
        const th = o.phase + t * o.speed;
        // Laps are counted off the angle rather than a timer, and from the far
        // point of the lane (sin = -1) so the boundary falls where the sprite
        // is hidden behind the disc.
        if (GIF_ORBIT_SWAP > 0) {
          const lap = Math.floor((th - Math.PI * 1.5) / (Math.PI * 2));
          if (o.lap == null) o.lap = lap;
          else if (lap !== o.lap) {
            o.lap = lap;
            if (++o.laps >= GIF_ORBIT_SWAP) {
              o.laps = 0;
              // A shared cursor deals the pool out instead of sampling it, so
              // eight orbiters taking turns work through all thirty-odd gifs
              // rather than landing on the same handful over and over.
              o.src = orbitCursor++ % sources.length;
              o.frame = 0;
              o.acc = 0;
            }
          }
        }
        const frames = sources[o.src % sources.length];
        if (!frames) continue;
        if (o.frame >= frames.length) o.frame = 0;
        o.acc += dt * 1000;
        let guard = 0;
        while (o.acc >= (frames[o.frame].dur || 100) && guard++ < 64) {
          o.acc -= (frames[o.frame].dur || 100);
          o.frame = (o.frame + 1) % frames.length;
        }
        const bmp = frames[o.frame].bmp;
        o.aspect = bmp.width / bmp.height;
        o.ctx.clearRect(0, 0, o.canvas.width, o.canvas.height);
        o.ctx.drawImage(bmp, 0, 0, o.canvas.width, o.canvas.height);
        o.tex.needsUpdate = true;

        const rx = dv.z * GIF_ORBIT_R * (1.03 + o.lane * 0.085);
        const ry = dv.z * Math.min(0.9, 0.75 * (0.45 + o.lane * 0.07));
        const laneRot = (o.lane - (orbiters.length - 1) / 2) * 0.16;
        const depth = Math.sin(th); // > 0 = in front of the moon
        const ex = Math.cos(th) * rx;
        const ey = Math.sin(th) * ry;
        const px = ex * Math.cos(laneRot) - ey * Math.sin(laneRot);
        const py = ex * Math.sin(laneRot) + ey * Math.cos(laneRot);
        const near = depth * 0.5 + 0.5;
        const scl = GIF_ORBIT_SCALE * (0.7 + 0.3 * near);
        o.mesh.visible = true;
        o.mesh.position.set(ccx + px * fhX, ccy + py * fhY, 0);
        o.mesh.scale.set(scl * o.aspect * fhX, scl * fhY, 1);
        const u = o.mat.uniforms;
        u.uOpacity.value = (0.55 + 0.45 * near) * seqLevel;
        // The far half is clipped against the disc silhouette in the fragment
        // shader, so it is eaten by the limb rather than fading out whole.
        u.uBehind.value = depth < 0 ? 1 : 0;
        u.uCen.value.set(ccx, ccy);
        u.uInv.value.set(1 / fhX, 1 / fhY);
        u.uR.value = dv.z;
      }
    }

    // The library index, fetched once and kept: an act change rebuilds the pool
    // out of it and there is no sense asking for it again every act.
    let library = null;
    // Bumped per load, so a slow act that is still decoding when the next one
    // starts drops what it has left instead of dealing it into the new pool.
    let poolGen = 0;
    async function loadPool(themeSpec) {
      const gen = ++poolGen;
      if (!library) {
        const get = async (u) => {
          try { return await fetch(u).then((r) => r.ok ? r.json() : null); } catch { return null; }
        };
        // The scraped library first, then the pre-curated subset that ships in
        // git. Either answers with the same shape; only its base differs.
        library = await get(GIF_INDEX) || await get(GIF_STARTER_INDEX);
      }
      if (!library) {
        console.warn("[gifswarm] no " + GIF_INDEX + " — run: npm run gifs");
        return;
      }
      const libBase = library.base || "assets/gifcities/";
      const marks = await loadGifMarks();
      if (dead || gen !== poolGen) return;
      const theme = String(themeSpec || "");
      const themes = Object.entries(library.themes || {});
      // Several themes can share one orbit — orbit:ankh,coral draws from both —
      // so a want of nothing means the whole library.
      const want = new Set(theme.split(",").map((s) => s.trim()).filter(Boolean));
      const collect = (only) => {
        const out = [];
        for (const [slug, t] of themes) {
          if (only.size && !only.has(slug)) continue;
          for (const g of t.gifs) {
            const p = libBase + slug + "/" + g.file;
            if (marks[p] !== "reject") out.push(p);
          }
        }
        return out;
      };
      // A named theme that was never scraped would otherwise leave the act
      // empty for its whole run, so fall back to the whole library.
      let pool = collect(want);
      if (!pool.length) pool = collect(new Set());
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      // Starred gifs go to the front of the shuffled pool, so a library that
      // has been picked over leads with the good ones instead of taking pot
      // luck. Sorting is stable, so the shuffle survives inside each group.
      pool.sort((a, b) => (marks[b] === "star") - (marks[a] === "star"));
      // A few dozen distinct GIFs is plenty of variety for any swarm size, and
      // they are dealt out as they land so the field fills in rather than
      // appearing all at once. Several at a time, though: each GIF is dozens
      // of async round trips — decode a frame, make a bitmap, key it, make
      // another — and strictly one file after another took the better part of
      // a minute, long enough for an act to be half over before it looked
      // like anything.
      const targets = pool.slice(0, 32);
      let next = 0;
      const loader = async () => {
        while (next < targets.length && !dead && gen === poolGen) {
          const src = targets[next++];
          let frames = null;
          try {
            frames = await decodeGifFrames(src);
            if (frames) frames = await trimGifFrames(frames);
          } catch { /* skip the broken one */ }
          if (!frames) continue;
          // Decoded into an act that has since handed on — nothing will ever
          // draw it, so give the memory back rather than growing the pool.
          if (dead || gen !== poolGen) { closeFrames(frames); continue; }
          sources.push(frames);
          srcs.push(src);
          sprites.forEach((s, i) => { s.src = i % sources.length; });
          // Spread the orbiters across the far end of the pool, so the handful
          // going round the moon are not the same handful filling the window.
          orbiters.forEach((o, i) => {
            o.src = (sources.length - 1 - i % sources.length + sources.length) % sources.length;
          });
        }
      };
      await Promise.all(Array.from({ length: 6 }, loader));
    }
    loadPool(theme);

    // Lit cells of a word, straight off the 5x7 bitmap glyphs the letter mosaic
    // already uses, mapped into canvas space.
    // Two cells of air between letters rather than the mosaic's one. The
    // mosaic draws crisp tiles; here every cell is an eyeball or a smiley with
    // its own outline, and at one cell of gap the letters run into each other.
    const GIF_GAP = 2;
    function wordCells(word) {
      const letters = word.split("");
      if (!letters.length) return [];
      // Pick the line count that gives the biggest letters in this opening. Six
      // letters across a nearly square window is a thin strip on one line and
      // twice the size on two, and size is the whole of legibility here.
      let best = null;
      for (let L = 1; L <= Math.min(4, letters.length); L++) {
        const per = Math.ceil(letters.length / L);
        const cols = per * (GLYPH_W + GIF_GAP) - GIF_GAP;
        const rows = L * (GLYPH_H + GIF_GAP) - GIF_GAP;
        const cell = Math.min(VW * GIF_ZOOM / cols, VH * GIF_ZOOM / rows);
        if (!best || cell > best.cell) best = { per, cols, rows, cell };
      }
      const { per, cols, rows, cell } = best;
      const x0 = (W - cols * cell) / 2;
      const y0 = (H - rows * cell) / 2;
      const out = [];
      letters.forEach((ch, li) => {
        const line = Math.floor(li / per);
        const inLine = Math.min(per, letters.length - line * per);
        const lead = (per - inLine) * (GLYPH_W + GIF_GAP) / 2; // centre a short last line
        const glyph = GLYPHS[ch] || GLYPHS[" "];
        for (let gy = 0; gy < GLYPH_H; gy++) {
          for (let gx = 0; gx < GLYPH_W; gx++) {
            if (!((glyph[gy] >> (GLYPH_W - 1 - gx)) & 1)) continue;
            out.push({
              x: x0 + (lead + (li % per) * (GLYPH_W + GIF_GAP) + gx + 0.5) * cell,
              y: y0 + (line * (GLYPH_H + GIF_GAP) + gy + 0.5) * cell,
              cell
            });
          }
        }
      });
      out.sort((a, b) => a.y - b.y || a.x - b.x);
      return out;
    }

    function retarget(word) {
      cells = wordCells(word);
      if (!cells.length) return;
      order.forEach((si, n) => {
        // More sprites than lit cells is the normal case, so they stack up and
        // overlap on each cell, which is what makes the letters read as a crowd.
        const c = cells[Math.floor(n * cells.length / order.length)];
        const s = sprites[si];
        s.tx = c.x + s.jx * c.cell * 0.18;
        s.ty = c.y + s.jy * c.cell * 0.18;
        s.cell = c.cell;
      });
    }

    let last = 0, wasNear = false, lastForm = 0, lastR = 0;
    function draw(t) {
      const dt = Math.min(0.05, last ? t - last : 0.016);
      last = t;

      updateSequence(t, dt);

      // The opening is measured then settles, so this only does anything for
      // the first turn and whenever the panel is resized from the controller.
      if (measureView()) {
        layoutHomes();
        if (phrase >= 0) retarget(GIF_WORDS[phrase]);
      }

      // The window only shows any of this while the tracked dark patch is on
      // the near side, so timing the word off a free-running clock spends most
      // of its effort spelling to the back of the moon. Drive it off the
      // rotation instead: the swarm gathers as the patch swings towards the
      // viewer and disperses as it leaves, and each approach takes the next
      // entry in the word list — so a word is always delivered to somebody.
      const tracking = useMosaic && haveAnchor;
      const off = tracking
        ? Math.abs(wrapPi(uniforms.uAnchor.value.x + uniforms.uRot.value)) : 0;
      const face = 1 - smooth01(off, Math.PI * 0.10, Math.PI * 0.40);

      let K, form;
      if (tracking) {
        const near = off < Math.PI * 0.40;
        if (near && !wasNear) {
          phrase = (phrase + 1) % GIF_WORDS.length;
          retarget(GIF_WORDS[phrase]);
        }
        wasNear = near;
        // Never fully uncoupled: the swarm is always busy finding itself, and
        // the approach tightens it the rest of the way.
        K = GIF_K * (0.35 + 0.65 * face);
        form = cells.length ? face : 0;
      } else {
        // Nothing to track — no mosaic, or the anchor survey has not finished
        // its first turn yet — so fall back to the free-running phrase clock.
        const u = (t % GIF_SEC) / GIF_SEC;
        const idx = Math.floor(t / GIF_SEC) % GIF_WORDS.length;
        if (idx !== phrase) { phrase = idx; retarget(GIF_WORDS[idx]); }
        K = GIF_K * smooth01(u, 0, 0.34);
        form = !cells.length ? 0
          : u < 0.54 ? smooth01(u, 0.36, 0.54)
          : u < 0.86 ? 1
          : 1 - smooth01(u, 0.86, 1);
      }

      // Mean-field Kuramoto: the order parameter makes the all-to-all sum
      // exact in one pass instead of N^2 of them.
      let sx = 0, sy = 0;
      for (const s of sprites) { sx += Math.cos(s.theta); sy += Math.sin(s.theta); }
