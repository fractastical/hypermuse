        if (luma <= SHADOW_FLOOR || luma > cutoff) continue;
        const u = (px + 0.5) / SAMPLE_W;
        const nx = ((u - disc.x) * (16 / 9)) / disc.r;
        const ny = (v - disc.y) / disc.r;
        const r2 = nx * nx + ny * ny;
        if (r2 >= 1) continue;
        const nz = Math.sqrt(1 - r2);
        if (nz < 0.35) continue; // too foreshortened near the limb to trust
        const lon = Math.atan2(nx, nz);
        const lat = Math.asin(Math.max(-1, Math.min(1, ny)));
        const surfLon = wrapPi(lon - rot);
        const bLon = Math.min(GRID_LON - 1, Math.floor((surfLon + Math.PI) / (2 * Math.PI) * GRID_LON));
        const bLat = Math.min(GRID_LAT - 1, Math.floor((lat + Math.PI / 2) / Math.PI * GRID_LAT));
        surfGrid[bLat * GRID_LON + bLon] += cutoff - luma + 0.01;
      }
    }
  }

  const anchorTarget = { lon: 0, lat: 0 };
  // The word's angular footprint grows/shrinks to fill the measured patch
  // unless the caller pinned it via ?angw= / ?angh=.
  let AUTO_ANG = params.get("angw") == null && params.get("angh") == null;
  const angTarget = { w: ANG_W, h: ANG_H };
  // Master multiplier on the window/word footprint, live from the
  // controller: 1 = as measured, 2 = twice the angular size.
  // The mumins need a wider window than the auto-measured shadow patch or
  // the ring gets cropped to a single dancer; the gif swarm needs it or the
  // ends of the word fall outside the opening.
  const WIDE_WIN = ["mumins", "gifswarm"].includes(baseKey(CONTENT_KEY));
  let WIN_SCALE = num("winscale", WIDE_WIN ? 1.6 : 1);
  let haveAnchor = false;
  let anchorLocked = false;
  let lastSampleT = -Infinity;

  function pickAnchor() {
    let bestScore = 0, bestLon = 0, bestLat = 0;
    for (let la = 1; la < GRID_LAT - 1; la++) {
      for (let lo = 0; lo < GRID_LON; lo++) {
        let s = 0;
        for (let dla = -1; dla <= 1; dla++) {
          for (let dlo = -1; dlo <= 1; dlo++) {
            s += surfGrid[(la + dla) * GRID_LON + ((lo + dlo + GRID_LON) % GRID_LON)];
          }
        }
        if (s > bestScore) { bestScore = s; bestLon = lo; bestLat = la; }
      }
    }
    if (bestScore <= 0) return;
    const lon0 = (bestLon + 0.5) / GRID_LON * 2 * Math.PI - Math.PI;
    const lat0 = (bestLat + 0.5) / GRID_LAT * Math.PI - Math.PI / 2;

    // Measure the patch's angular spread around the anchor so the word can
    // fill it: darkness-weighted centroid + deviation over nearby cells.
    let wSum = 0, mLon = 0, mLat = 0, vLon = 0, vLat = 0;
    const cellLonStep = 2 * Math.PI / GRID_LON, cellLatStep = Math.PI / GRID_LAT;
    for (let la = 0; la < GRID_LAT; la++) {
      const lat = (la + 0.5) * cellLatStep - Math.PI / 2;
      const dLat = lat - lat0;
      if (Math.abs(dLat) > 1.0) continue;
      for (let lo = 0; lo < GRID_LON; lo++) {
        const wgt = surfGrid[la * GRID_LON + lo];
        if (wgt <= 0) continue;
        const dLon = wrapPi((lo + 0.5) * cellLonStep - Math.PI - lon0);
        if (Math.abs(dLon) > 1.4) continue;
        wSum += wgt;
        mLon += dLon * wgt; mLat += dLat * wgt;
        vLon += dLon * dLon * wgt; vLat += dLat * dLat * wgt;
      }
    }
    let latMax = Math.PI / 2 - angTarget.h / 2 - 0.08;
    if (wSum > 0) {
      const cLon = mLon / wSum, cLat = mLat / wSum;
      const stdLon = Math.sqrt(Math.max(0, vLon / wSum - cLon * cLon));
      const stdLat = Math.sqrt(Math.max(0, vLat / wSum - cLat * cLat));
      anchorTarget.lon = wrapPi(lon0 + cLon + LON_OFF);
      if (AUTO_ANG) {
        angTarget.w = Math.max(0.9, Math.min(2.6, stdLon * 3.6));
        angTarget.h = Math.max(0.55, Math.min(1.5, stdLat * 3.6));
      }
      latMax = Math.PI / 2 - angTarget.h / 2 - 0.08;
      anchorTarget.lat = Math.max(-latMax, Math.min(latMax, lat0 + cLat + LAT_OFF));
    } else {
      anchorTarget.lon = wrapPi(lon0 + LON_OFF);
      anchorTarget.lat = Math.max(-latMax, Math.min(latMax, lat0 + LAT_OFF));
    }
    haveAnchor = true;
  }

  function rotationPeriod() {
    return ROT_PER > 0 ? ROT_PER : (moon.video.duration || 6);
  }

  // The survey. Two things come out of it: where the disc is, which every
  // layout needs in order to be centred, and the darkest patch of terrain,
  // which only the word mosaic does. It used to run only when there was a
  // mosaic, so a moon carrying no word was placed on the unmeasured defaults -
  // fine for the loops whose disc happens to sit at the middle of the frame,
  // and 6% of a radius out on the neon one, which does not.
  function surveyMoon(t) {
    const per = rotationPeriod();
    const rot = ROT_DIR * 2 * Math.PI * ((moon.video.currentTime % per) / per);
    uniforms.uRot.value = rot;
    if (anchorLocked || t - lastSampleT < 0.2) return;
    lastSampleT = t;
    sampleSurface(rot);
    if (mosaic) pickAnchor();
    // One full revolution surveyed: the darkest terrain has won, pin it.
    if (t >= (per / SPEED) * 1.05 + 1) anchorLocked = true;
  }

  function updateMosaicAnchor(t) {
    if (haveAnchor) {
      const a = uniforms.uAnchor.value;
      a.x += wrapPi(anchorTarget.lon - a.x) * 0.1;
      a.y += (anchorTarget.lat - a.y) * 0.1;
      const g = uniforms.uAng.value;
      const scale = WIN_SCALE * (mosaic && mosaic.showingLogo ? LOGO_SCALE : 1);
      const tw = Math.min(2.9, angTarget.w * scale);
      const th = Math.min(2.4, angTarget.h * scale);
      g.x += (tw - g.x) * 0.1;
      g.y += (th - g.y) * 0.1;
      chooseLines(g.x / g.y);
    }
  }

  // Is the anchored box currently on the visible near side? Peeks and
  // incant advances only happen when someone could actually see them.
  function anchorFacing() {
    if (!useMosaic || !haveAnchor) return true;
    const facing = wrapPi(uniforms.uAnchor.value.x + uniforms.uRot.value);
    return Math.abs(facing) < Math.PI * 0.42;
  }

  // Random apparition scheduler: the reveal gate eases in, holds, eases out,
  // then sleeps a randomized interval around APPARITION seconds. incant
  // advances to the next mantra at the start of each apparition.
  const appar = { phase: APPARITION > 0 ? "sleep" : "on", next: 2 + Math.random() * 3, level: APPARITION > 0 ? 0 : 1 };
  function updateApparition(t, dt) {
    if (APPARITION <= 0) {
      appar.level = Math.min(1, appar.level + dt * 1.5);
      appar.phase = "on";
      uniforms.uGate.value = appar.level;
      return;
    }
    if (appar.phase === "on") {
      // Apparitions switched on live: fade out and join the cycle.
      appar.phase = "out";
    }
    if (appar.phase === "sleep" && t >= appar.next) {
      appar.phase = "in";
      if (incant) incant.advance();
    } else if (appar.phase === "in") {
      appar.level += dt / 1.6;
      if (appar.level >= 1) { appar.level = 1; appar.phase = "hold"; appar.next = t + 2.5 + Math.random() * 3.5; }
    } else if (appar.phase === "hold" && t >= appar.next) {
      appar.phase = "out";
    } else if (appar.phase === "out") {
      appar.level -= dt / 2.2;
      if (appar.level <= 0) {
        appar.level = 0;
        appar.phase = "sleep";
        appar.next = t + APPARITION * (0.55 + Math.random() * 0.9);
      }
    }
    uniforms.uGate.value = appar.level;
  }

  // Peek cycle: every PEEK seconds (while the word faces the viewer) the
  // letters dissolve, the window grows, holds for PEEK_HOLD, and restores.
  const peek = { phase: "idle", next: PEEK, wordOn: WORDLESS_WIN ? 0 : 1, grow: WORDLESS_WIN ? PEEK_GROW : 1 };
  function updatePeek(t, dt) {
    if (WORDLESS_WIN || !WIN) return;
    if (PEEK > 0) {
      if (peek.phase === "idle" && t >= peek.next && anchorFacing()) {
        peek.phase = "out";
      } else if (peek.phase === "out") {
        peek.wordOn -= dt / 1.4;
        if (peek.wordOn <= 0) { peek.wordOn = 0; peek.phase = "open"; peek.next = t + PEEK_HOLD; }
      } else if (peek.phase === "open" && t >= peek.next) {
        peek.phase = "in";
      } else if (peek.phase === "in") {
        peek.wordOn += dt / 1.4;
        if (peek.wordOn >= 1) { peek.wordOn = 1; peek.phase = "idle"; peek.next = t + PEEK * (0.8 + Math.random() * 0.5); }
      }
    }
    const growTarget = 1 + (PEEK_GROW - 1) * (1 - peek.wordOn);
    peek.grow += (growTarget - peek.grow) * Math.min(1, dt * 3);
    uniforms.uWordOn.value = peek.wordOn;
    uniforms.uWinGrow.value = peek.grow;
  }

  // Guest marks change hands round the back of the moon. Waiting for the
  // panel to turn away costs nothing — the next mark is simply already there
  // when it comes round — and it means nobody ever watches a logo cut to
  // another one. If the panel somehow stays facing, swap anyway rather than
  // letting one guest hold the slot for ever.
  let logoNextAt = LOGO_SEC;
  function updateLogos(t) {
    if (!mosaic || mosaic.logoCount < 2 || LOGO_SEC <= 0) return;
    if (t < logoNextAt) return;
    if (anchorFacing() && t < logoNextAt + rotationPeriod() / SPEED) return;
    mosaic.nextSlot();
    logoNextAt = t + LOGO_SEC;
  }

  // Adaptive planar bleed: keep the revealed area near BLEED% of the disc by
  // walking the luma threshold, and center the reveal on the centroid of the
  // shadowed hemisphere (uSpot) rather than wherever the cutoff bites first.
  let lastBleedT = -Infinity;
  function adaptBleed(t) {
    if (useMosaic || BLEED <= 0 || t - lastBleedT < 0.5) return;
    if (moon.video.readyState < 2) return;
    lastBleedT = t;
    sampleCtx.clearRect(0, 0, SAMPLE_W, SAMPLE_H);
    sampleCtx.drawImage(moon.video, 0, 0, SAMPLE_W, SAMPLE_H);
    const data = sampleCtx.getImageData(0, 0, SAMPLE_W, SAMPLE_H).data;
    let discCount = 0, darkCount = 0, cX = 0, cY = 0, cW = 0;
    const thresh = +uniforms.uThresh.value;
    for (let py = 0; py < SAMPLE_H; py++) {
      const v = 1 - (py + 0.5) / SAMPLE_H;
      for (let px = 0; px < SAMPLE_W; px++) {
        const i = (py * SAMPLE_W + px) * 4;
        if (data[i + 3] < 235) continue;
        const u = (px + 0.5) / SAMPLE_W;
        const dx = (u - disc.x) * (16 / 9), dy = v - disc.y;
        if (dx * dx + dy * dy > disc.r * disc.r * 0.92) continue;
        discCount++;
        const luma = (0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2]) / 255;
        if (luma < thresh) darkCount++;
        // Centroid of the whole shadowed side (generous cutoff), skipping the
        // outer ring so the spot lands mid-hemisphere, not on the limb.
        if (luma < 0.16 && dx * dx + dy * dy < disc.r * disc.r * 0.62) {
          const w = 0.16 - luma;
          cX += u * w; cY += v * w; cW += w;
        }
      }
    }
    if (discCount > 50) {
      const frac = darkCount / discCount;
      const target = BLEED / 100;
      // Walk the threshold toward the target area.
      if (frac > target * 1.15) uniforms.uThresh.value = Math.max(0.02, thresh - 0.006);
      else if (frac < target * 0.85) uniforms.uThresh.value = Math.min(0.6, thresh + 0.006);
    }
    if (cW > 0.5) {
      const s = uniforms.uSpot.value;
      const rSpot = disc.r * Math.max(0.18, Math.min(0.55, Math.sqrt(BLEED / 100) * 1.6));
      s.x += (cX / cW - s.x) * 0.2;
      s.y += (cY / cW - s.y) * 0.2;
      s.z = rSpot;
    }
  }

  // --- Program sequencer: long arcs measured in moon rotations -----------
  // A program is a list of acts. Each act repeats [dark rotations - just
  // the word on the dark patch] -> [reveal rotations - the window opens
  // wordless on the act's content] and then hands to the next act, so
  // something only shows through every few rotations and the content
  // progresses. The "hour" program is 204 rotations: ~62 min at the default
  // speed 1/3 with the 6s moon loop (each rotation ~18s of wall time).
  // "eye" is a special program content: instead of opening the dark-side
  // window it loads the eye-seal gif behind the disc (if no backdrop is set)
  // and irises the moon open for that rotation, sealing again on the next.
  const PROGRAMS = {
    // 201 rotations: at the nominal 18 s rotation that is just over an hour,
    // which is the loop the show runs on. Keep it there — a program that
    // overruns the hour gets cut off mid-act instead of landing.
    hour: [
      { cycles: 5, dark: 2, reveal: 1, content: "crt" },
      { cycles: 6, dark: 2, reveal: 1, content: "incant", fisher: true },
      { cycles: 5, dark: 2, reveal: 1, content: "vajra" },
      // Two cycles borrowed off the crt and vajra acts above, so the lap still
      // comes to exactly 201 rotations and still lands inside the hour.
      { cycles: 2, dark: 2, reveal: 1, content: "gifswarm" },
      { cycles: 5, dark: 2, reveal: 1, content: "fold" },
      { cycles: 5, dark: 2, reveal: 1, content: "foldhelix" },
      { cycles: 6, dark: 2, reveal: 1, content: "cymatics", fisher: true },
      { cycles: 5, dark: 2, reveal: 1, content: "foldjitter" },
      { cycles: 5, dark: 2, reveal: 1, content: "foldgeo" },
      // The shadow comes on two thirds through and takes 18 min, so it is
      // well clear before the lap ends and the hour brings it round again.
      { cycles: 6, dark: 2, reveal: 1, content: "harmonics", eclipse: 18 },
      { cycles: 4, dark: 2, reveal: 1, content: "foldivm" },
      { cycles: 4, dark: 2, reveal: 1, content: "foldsonic" },
      { cycles: 5, dark: 2, reveal: 1, content: "fisher" },
      { cycles: 4, dark: 2, reveal: 1, content: "artifacts/sample-sonicsphere-silent.webm" }
    ],
    // Every effect we have, one per act, three rotations each: two dark
    // rotations on the word then one wordless reveal. Sequenced so no two
    // neighbouring acts look alike — a fold never follows a fold. Screen
    // capture is left out on purpose; it needs a click to grant the source.
    library: [
      { cycles: 1, dark: 2, reveal: 1, content: "crt" },
      { cycles: 1, dark: 2, reveal: 1, content: "fold" },
      { cycles: 1, dark: 2, reveal: 1, content: "mumins" },
      { cycles: 1, dark: 2, reveal: 1, content: "incant", fisher: true },
      { cycles: 1, dark: 2, reveal: 1, content: "foldhelix" },
      { cycles: 1, dark: 2, reveal: 1, content: "cymatics" },
      { cycles: 1, dark: 2, reveal: 1, content: "gifswarm" },
      { cycles: 1, dark: 2, reveal: 1, content: "fisher" },
      { cycles: 1, dark: 2, reveal: 1, content: "harmonics" },
      { cycles: 1, dark: 2, reveal: 1, content: "vajra" },
      { cycles: 1, dark: 2, reveal: 1, content: "foldjitter" },
      { cycles: 1, dark: 2, reveal: 1, content: "eye" },
      { cycles: 1, dark: 2, reveal: 1, content: "foldgeo" },
      { cycles: 1, dark: 2, reveal: 1, content: "artifacts/sample-sonicsphere-silent.webm" },
      { cycles: 1, dark: 2, reveal: 1, content: "foldivm" },
      { cycles: 1, dark: 2, reveal: 1, content: "foldsonic" }
    ],
    // Everything, one per rotation, with no word-only rotation in between:
    // each effect gets exactly one pass of the window across the face before
    // the next one takes over. Fifteen rotations, about 4.5 min a lap.
    carousel: [
      { cycles: 1, dark: 0, reveal: 1, content: "crt" },
      { cycles: 1, dark: 0, reveal: 1, content: "fold" },
      { cycles: 1, dark: 0, reveal: 1, content: "mumins" },
      { cycles: 1, dark: 0, reveal: 1, content: "incant" },
      { cycles: 1, dark: 0, reveal: 1, content: "foldhelix" },
      { cycles: 1, dark: 0, reveal: 1, content: "cymatics" },
      { cycles: 1, dark: 0, reveal: 1, content: "gifswarm" },
      { cycles: 1, dark: 0, reveal: 1, content: "fisher" },
      { cycles: 1, dark: 0, reveal: 1, content: "harmonics" },
      { cycles: 1, dark: 0, reveal: 1, content: "vajra" },
      { cycles: 1, dark: 0, reveal: 1, content: "foldjitter" },
      { cycles: 1, dark: 0, reveal: 1, content: "eye" },
      { cycles: 1, dark: 0, reveal: 1, content: "foldgeo" },
      { cycles: 1, dark: 0, reveal: 1, content: "artifacts/sample-sonicsphere-silent.webm" },
      { cycles: 1, dark: 0, reveal: 1, content: "foldivm" },
      { cycles: 1, dark: 0, reveal: 1, content: "foldsonic" }
    ],
    // The GifCities exhibit: one scraped theme per act, four rotations each,
    // so a room gets a couple of minutes of lava lamps finding each other and
    // spelling something before the hearts take over. About twelve minutes a
    // lap. A theme that was never scraped falls back to the whole library
    // rather than showing an empty window.
    gifcities: [
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:moon" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:ufo" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:lava-lamp" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:alien" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:heart" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:spaceship" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:eye" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:saturn" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:skull" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:rainbow" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm:astronaut" },
      { cycles: 2, dark: 1, reveal: 1, content: "gifswarm" }
    ],
    // The soft program: someone is out on the crescent fishing stars, the
    // troupe turns up now and then, and the eye opens once a lap.
    nightfishing: [
      { cycles: 4, dark: 1, reveal: 1, content: "fisher" },
      { cycles: 2, dark: 2, reveal: 1, content: "mumins" },
      { cycles: 1, dark: 0, reveal: 1, content: "eye" }
    ],
    // Word-only moon; the eye seal irises open once every 10th rotation.
    eye10: [
      { cycles: 1, dark: 9, reveal: 1, content: "eye" }
    ],
    // The bucky fold repertoire, a reveal every 3rd rotation.
    folds: [
      { cycles: 2, dark: 2, reveal: 1, content: "fold" },
      { cycles: 2, dark: 2, reveal: 1, content: "foldhelix" },
      { cycles: 2, dark: 2, reveal: 1, content: "foldjitter" },
      { cycles: 2, dark: 2, reveal: 1, content: "foldgeo" },
      { cycles: 2, dark: 2, reveal: 1, content: "foldivm" },
      { cycles: 2, dark: 2, reveal: 1, content: "foldsonic" }
    ],
    // Folds every 3rd rotation with the eye breaking through every 10th.
    eyefolds: [
      { cycles: 1, dark: 2, reveal: 1, content: "fold" },
      { cycles: 1, dark: 2, reveal: 1, content: "foldhelix" },
      { cycles: 1, dark: 2, reveal: 1, content: "foldjitter" },
      { cycles: 1, dark: 0, reveal: 1, content: "eye" }
    ]
  };
  const EYE_BACKDROP = "assets/esoteric-geometries-circles-warp.gif";
  let progEyeOn = false;
  let progSchedule = null; // flat: one entry per rotation, loops forever
  let progName = "";
  let progUnknown = "";
  let progApplied = -1;
  let progLoops = 0, progPrevVideoT = 0;
  let progOwnsFisher = false; // the program only touches the companion if an act asks for it
  // Accepts a named program ("hour"), a custom act array from the
  // controller's program editor, or a JSON act array in the URL param.
  function setProgram(spec) {
    let acts = null;
    if (Array.isArray(spec)) { acts = spec; progName = "custom"; }
    else {
      const s = String(spec == null ? "" : spec).trim();
      if (s.startsWith("[")) {
        try { acts = JSON.parse(s); progName = "custom"; } catch { acts = null; }
      } else if (PROGRAMS[s.toLowerCase()]) {
        acts = PROGRAMS[s.toLowerCase()];
        progName = s.toLowerCase();
      }
    }
    // Any program change seals an eye reveal the old program left open.
    if (progEyeOn) { IRIS_TARGET = 0; progEyeOn = false; }
    if (!acts || !acts.length) {
      progSchedule = null;
      progName = "";
      // A name this build doesn't know is almost always a page left open from
      // before the preset was written. Say which one, so the controller can
      // ask for a reload instead of the moon just going quiet on the word.
      progUnknown = typeof spec === "string" && spec.trim() ? spec.trim() : "";
      if (progUnknown) {
        console.warn('hypermoon: no program named "' + progUnknown + '" in this page - reload to pick up newer presets');
      }
      return;
    }
    progUnknown = "";
    progSchedule = [];
    // An act can also carry the show around it: `fisher` brings the companion
    // in for its stretch, `eclipse` starts a transit of that many minutes as
    // the act opens. Because the schedule wraps, an act-triggered eclipse
    // recurs once per lap on its own.
    progOwnsFisher = acts.some((a) => a.fisher != null);
    for (const act of acts) {
      const cycles = Math.max(1, Math.round(+act.cycles || 1));
      const dark = Math.max(0, Math.round(act.dark == null ? 2 : +act.dark));
      const reveal = Math.max(1, Math.round(act.reveal == null ? 1 : +act.reveal));
      const content = String(act.content || "").trim();
      const fisher = progOwnsFisher ? !!act.fisher : null;
      const from = progSchedule.length;
      for (let c = 0; c < cycles; c++) {
        for (let d = 0; d < dark; d++) progSchedule.push({ content: "", wordless: false, fisher });
        for (let r = 0; r < reveal; r++) progSchedule.push({ content, wordless: true, fisher });
      }
      const eclipseMin = Math.max(0, +act.eclipse || 0);
      if (eclipseMin > 0 && progSchedule[from]) progSchedule[from].eclipse = eclipseMin;
    }
    progApplied = -1; // apply the current rotation's entry on the next frame
  }
  function updateProgram() {
    if (!progSchedule || !useMosaic) return;
    const vt = moon.video.currentTime || 0;
    if (vt < progPrevVideoT - 0.5) progLoops++;
    progPrevVideoT = vt;
    const per = rotationPeriod();
    const rot = Math.floor((progLoops * (moon.video.duration || per) + vt) / per);
    if (rot === progApplied) return;
    progApplied = rot;
    const entry = progSchedule[rot % progSchedule.length];
    if (entry.fisher != null && entry.fisher !== FISHER_LIVE) setFisherLive(entry.fisher);
    if (entry.eclipse) {
      ECL_ON = true;
      uniforms.uEclOn.value = 1;
      ECL_P = 0;
      uniforms.uEcl.value.x = 0;
      ECL_SEC = entry.eclipse * 60;
      ECL_TARGET = 1;
      eclNextAt = 0; // the act is the schedule now, not the repeat timer
    }
    if (entry.content === "eye") {
      // Iris reveal instead of a window: load the eye seal behind the disc
      // (unless a backdrop is already chosen) and open for this rotation.
      if (!BACKDROP_SRC) setBackdrop(EYE_BACKDROP);
      if (CONTENT_SRC) setWindowContent("");
      IRIS_TARGET = 1;
      progEyeOn = true;
      return;
    }
    if (progEyeOn) { IRIS_TARGET = 0; progEyeOn = false; }
    if (CONTENT_SRC !== entry.content || (WIN && WORDLESS_WIN !== entry.wordless)) {
      setWindowContent(entry.content, entry.wordless);
    }
  }

  const start = performance.now();
  // Screen-capture content can't be built at parse time (it registers its
  // own gesture handler); route it through the live switcher instead.
  if (useMosaic && CONTENT_KEY === "screen") setWindowContent("screen");
  if (FISHER_LIVE) setFisherLive(true);
  if (params.get("program")) setProgram(params.get("program"));

  // --- Pixel feed: driving an LED rig off the moon ------------------------
  // A page cannot open a UDP socket, so it cannot address a PixLite itself.
  // What it can do is look at what it just drew: the bridge
  // (npm run pixels) sends over the map of where every LED takes its colour
  // from, the moon samples those points each frame and posts the bytes back,
  // and the bridge turns them into sACN or Art-Net.
  const PIXELS = params.get("pixels") === "1";
  const PIXEL_URL = params.get("pixelhost")
    || "ws://" + (location.hostname || "127.0.0.1") + ":" + (params.get("pixelport") || 8082);
  const PIXEL_FPS = num("pixelfps", 40);
  // LEDs are driven linearly but the frame is sRGB, so sending it raw makes
  // everything below half brightness read far too hot. The curve is worth
  // having on a slider: rig, pixel type and room all move it.
  const PIXEL_GAMMA = num("pixelgamma", 2.2);
  const PIXEL_GAIN = num("pixelgain", 1);
  const pixLut = new Uint8Array(256);
  for (let i = 0; i < 256; i++) {
    pixLut[i] = Math.max(0, Math.min(255,
      Math.round(255 * Math.pow((i / 255) * PIXEL_GAIN, PIXEL_GAMMA))));
  }
  const pix = { ws: null, pts: null, buf: null, c: null, ctx: null, last: 0 };
  const PIX_W = 192;   // the sampling composite; LEDs are coarse, this is plenty

  function pixelConnect() {
    let ws;
    try { ws = new WebSocket(PIXEL_URL); } catch (e) { return; }
    pix.ws = ws;
    ws.binaryType = "arraybuffer";
    ws.addEventListener("message", (e) => {
      if (typeof e.data !== "string") return;
      let msg; try { msg = JSON.parse(e.data); } catch (err) { return; }
      if (msg.type !== "map" || !msg.map) return;
      // Flattened in the order the bridge packed its universes, so the frame
      // can go over as bare bytes with no indices attached. Each point keeps
      // the space it was authored in: disc-space points are resolved against
      // the measured disc every frame, so they hold the limb through a
      // moonscale change or a resize instead of drifting off into black.
      pix.pts = msg.map.outputs.reduce((a, o) => a.concat(
        o.pixels.map((p) => [p[0], p[1], o.space === "disc" ? 1 : 0])), []);
      pix.buf = new Uint8Array(pix.pts.length * 3);
      console.log("hypermoon: pixel map '" + msg.map.name + "', " + pix.pts.length + " leds");
    });
    // The bridge is usually started after the moon, and a show machine will
    // have it come and go; reconnecting quietly beats reloading the output.
    ws.addEventListener("close", () => {
      pix.ws = null; pix.pts = null;
      if (PIXELS) setTimeout(pixelConnect, 3000);
    });
    ws.addEventListener("error", () => { try { ws.close(); } catch (e) { /* already gone */ } });
  }
  if (PIXELS) pixelConnect();

  function pixelSample() {
    if (!pix.ws || pix.ws.readyState !== 1 || !pix.pts) return;
    const now = performance.now();
    if (now - pix.last < 1000 / PIXEL_FPS) return;
    pix.last = now;
    const vw = window.innerWidth, vh = window.innerHeight;
    const sh = Math.max(1, Math.round(PIX_W * vh / vw));
    if (!pix.c) {
      pix.c = document.createElement("canvas");
      pix.ctx = pix.c.getContext("2d", { willReadFrequently: true });
    }
    if (pix.c.width !== PIX_W || pix.c.height !== sh) { pix.c.width = PIX_W; pix.c.height = sh; }
    const ctx = pix.ctx, k = PIX_W / vw;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, PIX_W, sh);
    // The rig should show what the room sees, and the room sees three stacked
    // layers, only one of which is the WebGL canvas.
    if (sky.el && sky.el.style.display !== "none") ctx.drawImage(sky.el, 0, 0, PIX_W, sh);
    const bd = backdrop.el && backdrop.players[backdrop.idx];
    if (bd && bd.node) {
      const rect = backdrop.el.getBoundingClientRect();
      const src = bd.node;
      const sw = src.videoWidth || src.naturalWidth || src.width;
      const sy = src.videoHeight || src.naturalHeight || src.height;
      if (sw && sy && rect.width > 0) {
        const cx = (rect.left + rect.width / 2) * k;
        const cy = (rect.top + rect.height / 2) * k;
        const rad = (rect.width / 2) * k;
        ctx.save();
        ctx.globalAlpha = BACK_ALPHA;
        // Same circular clip the DOM applies, or the LEDs pick up the corners
        // of a square clip that no one in the room can see.
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.clip();
        const fit = BACK_FIT ? bd.fit : null;
        const scale = (1 + (IRIS_ZOOM - 1) * uniforms.uIris.value) * (fit ? fit.s : 1);
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        if (fit) ctx.translate(-fit.ox * rad * 2, -fit.oy * rad * 2);
        // Video covers its circle, stills are contained — matching the CSS.
        const f = bd.video
          ? Math.max(rad * 2 / sw, rad * 2 / sy)
          : Math.min(rad * 2 / sw, rad * 2 / sy);
        ctx.drawImage(src, -sw * f / 2, -sy * f / 2, sw * f, sy * f);
        ctx.restore();
      }
    }
    ctx.drawImage(renderer.domElement, 0, 0, PIX_W, sh);

    const img = ctx.getImageData(0, 0, PIX_W, sh).data;
    // Where the disc actually landed this frame, in sampling-canvas pixels —
    // the same reckoning positionBackdrop uses to pin the backdrop to it.
    const qw = quad.scale.x * vw, qh = quad.scale.y * vh;
    const dcx = (vw / 2 + (disc.x - 0.5) * qw + quad.position.x * vw / 2) * k;
    const dcy = (vh / 2 - (disc.y - 0.5) * qh - quad.position.y * vh / 2) * k;
    const dr = disc.r * qh * k;
    const pts = pix.pts, buf = pix.buf;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const px = p[2] ? dcx + p[0] * dr : p[0] * PIX_W;
      const py = p[2] ? dcy + p[1] * dr : p[1] * sh;
      const x = Math.max(0, Math.min(PIX_W - 1, Math.round(px)));
      const y = Math.max(0, Math.min(sh - 1, Math.round(py)));
      const o = (y * PIX_W + x) * 4;
      buf[i * 3] = pixLut[img[o]];
      buf[i * 3 + 1] = pixLut[img[o + 1]];
      buf[i * 3 + 2] = pixLut[img[o + 2]];
    }
    try { pix.ws.send(buf); } catch (e) { /* socket closing under us */ }
  }

  // --- Solo bake mode: blit the content maker straight to the screen ------
  let soloCtx = null, soloIncantFrame = -1;
  if (SOLO) {
    renderer.domElement.style.display = "none";
    const c = document.createElement("canvas");
    c.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;";
    document.body.appendChild(c);
    soloCtx = c.getContext("2d");
    window.__hyperstitionReady = true;
  }
  function soloFrame(t) {
    if (incant) {
      const f = Math.floor(t / 6);
      if (f !== soloIncantFrame) { soloIncantFrame = f; incant.advance(); }
    }
    if (crt) crt.draw(t);
    if (cave) cave.draw(t);
    if (mumins) mumins.draw(t);
    if (fisher) fisher.draw(t);
    if (harmonics) harmonics.draw(t);
    if (cymatics) cymatics.draw(t, 1 / 60);
    if (fold) fold.draw(t);
    const cnv = soloCtx.canvas;
    if (cnv.width !== window.innerWidth || cnv.height !== window.innerHeight) {
      cnv.width = window.innerWidth;
      cnv.height = window.innerHeight;
    }
    soloCtx.fillStyle = "#020411";
    soloCtx.fillRect(0, 0, cnv.width, cnv.height);
    const maker = fold || crt || cave || mumins || fisher || harmonics || cymatics || incant;
    const src = maker && maker.texture && maker.texture.image;
    if (src && src.width) {
      // cover-crop the (square) maker canvas into the viewport
      const s = Math.max(cnv.width / src.width, cnv.height / src.height);
      const w = src.width * s, h = src.height * s;
      soloCtx.drawImage(src, (cnv.width - w) / 2, (cnv.height - h) / 2, w, h);
    }
  }

  let prevT = 0;
  function animate() {
    const t = (performance.now() - start) / 1000;
    const dt = Math.min(0.1, t - prevT);
    prevT = t;
    if (SOLO) {
      // Solo is a preview of the generators, and several of them listen to
      // the room now, so it needs the analyser feed too.
      pollMic();
      updateAudio(dt);
      soloFrame(t);
      return;
    }
    uniforms.uTime.value = t;
    if (SCROLL_SEC > 0 && !contentVideo && !imageTextures.length && !useMosaic) {
      uniforms.uScroll.value = (t / SCROLL_SEC) % 1;
    }
    if (imageTextures.length > 1 && IMAGE_SEC > 0) {
      const slide = imageTextures[Math.floor(t / IMAGE_SEC) % imageTextures.length];
      if (WIN) {
        uniforms.uWinTex.value = slide;
        const img = slide.image;
        if (img && img.width) uniforms.uWinAspect.value = img.width / img.height;
      } else {
        uniforms.uContent.value = slide;
      }
    }
    if (crt) crt.draw(t);
    if (cave) cave.draw(t);
    if (mumins) mumins.draw(t);
    if (fisher) fisher.draw(t);
    if (harmonics) harmonics.draw(t);
    if (cymatics) cymatics.draw(t, dt);
    if (gifswarm) { gifswarm.draw(t); window.__gifswarm = gifswarm; }
    if (fold) { fold.draw(t); window.__fold = fold; }
    pollMic();
    updateAudio(dt);
    drawSky(t, dt);
    // Music rides on top of the slider bases: earthshine breathes with the
    // bass, window glow shimmers with the highs + beats, content brightness
    // lifts with overall level.
    uniforms.uLift.value = liftBase + REACT * audio.bass * 0.055;
    uniforms.uWinBright.value = winBrightBase * (1 + REACT * (audio.high * 0.55 + audio.beatEnv * 0.3));
    uniforms.uBright.value = brightBase * (1 + REACT * audio.level * 0.3);
    surveyMoon(t);
    if (mosaic) {
      updateMosaicAnchor(t);
      // Shimmer the tiles by reshuffling cube images a few times a second;
      // loud music shakes them faster (accumulated phase so rate changes
      // don't skip frames).
      mosaicPhase += dt * (2.5 + REACT * audio.level * 6);
      const frame = Math.floor(mosaicPhase);
      if (frame !== mosaicFrame) {
        mosaicFrame = frame;
        mosaic.redraw();
      }
      updateLogos(t);
    }
    updateProgram();
    updateApparition(t, dt);
    updatePeek(t, dt);
    adaptBleed(t);
    updateVajras(t);
    updateFlash(t);
    updateFisherLive(t);
    // Ease the iris toward its target over ~IRIS_SEC with a smooth ramp.
    {
      const cur = uniforms.uIris.value;
      const step = dt / IRIS_SEC;
      uniforms.uIris.value = Math.abs(IRIS_TARGET - cur) <= step
        ? IRIS_TARGET
        : cur + Math.sign(IRIS_TARGET - cur) * step;
    }
    // Walk the blood-moon grade toward its target (instant when BLOOD_SEC=0)
    // - this is what carries the multi-hour eclipse fades.
    if (uniforms.uBloodAmt.value !== BLOOD_TARGET) {
      const cur = uniforms.uBloodAmt.value;
      const step = BLOOD_SEC > 0 ? dt / BLOOD_SEC : 1;
      uniforms.uBloodAmt.value = Math.abs(BLOOD_TARGET - cur) <= step
        ? BLOOD_TARGET
        : cur + Math.sign(BLOOD_TARGET - cur) * step;
      BLOOD_AMT = uniforms.uBloodAmt.value;
    }
    // Same walk for the shadow transit: eclipserun is the seconds a full
    // pass takes, so a 2 h eclipse is just a very slow one.
    if (ECL_ON && ECL_P !== ECL_TARGET) {
      const step = ECL_SEC > 0 ? dt / ECL_SEC : 1;
      ECL_P = Math.abs(ECL_TARGET - ECL_P) <= step
        ? ECL_TARGET
        : ECL_P + Math.sign(ECL_TARGET - ECL_P) * step;
      uniforms.uEcl.value.x = ECL_P;
    } else if (ECL_ON && ECL_EVERY > 0 && ECL_P >= 1) {
      // A finished transit would otherwise sit there for the rest of the
      // night. Rewind it to the far side (both ends are a clear moon, so
      // nothing jumps) and let the shadow come round again.
      if (eclNextAt === 0) eclNextAt = t + ECL_EVERY * 60;
      else if (t >= eclNextAt) {
        ECL_P = 0;
        uniforms.uEcl.value.x = 0;
        ECL_TARGET = 1;
        eclNextAt = 0;
      }
    }
    centerQuad();
    positionBackdrop();
    zoomBackdrop();
    renderer.render(scene, camera);
    if (PIXELS) pixelSample();
  }

  // --- Frame pump ---------------------------------------------------------
  // requestAnimationFrame is the good clock, but macOS stops driving it the
  // moment the window is occluded, the display blanks or the session locks —
  // and a frozen canvas freezes the LAN broadcast with it. So rAF stays the
  // primary source and a timer watches the gap: if no frame has landed for
  // longer than a couple of fallback intervals, the timer renders instead.
  // The rAF chain is never cancelled, so the pump slides back to it silently
  // the instant the compositor resumes.
  const FALLBACK_MS = 1000 / KEEP_FPS;
  const STALL_MS = Math.max(120, FALLBACK_MS * 2.5);
  const REVIVE_MS = 2000;
  let lastFrameAt = performance.now();
  let frameCount = 0, stallCount = 0, timerFrames = 0;
  let onTimer = TICKER === "timer";
  function pump() {
    animate();
    lastFrameAt = performance.now();
    frameCount++;
  }
  // Generation counter rather than a plain "pending" flag: a revival has to
  // be able to replace a request that will never be answered, without
  // leaving two live chains behind when a deferred callback finally lands.
  let rafGen = 0, rafArmed = false, lastRafAt = performance.now(), lastReviveAt = 0;
  function rafChain() {
    if (rafArmed) return;
    rafArmed = true;
    const gen = ++rafGen;
    requestAnimationFrame(() => {
      if (gen !== rafGen) return; // superseded; let this branch die
      rafArmed = false;
      onTimer = false;            // the compositor is answering again
      lastRafAt = performance.now();
      pump();
      rafChain();
    });
  }
  if (TICKER !== "timer") rafChain();
  if (TICKER !== "raf") {
    setInterval(() => {
      const now = performance.now();
      if (!onTimer && now - lastFrameAt > STALL_MS) { onTimer = true; stallCount++; }
      if (onTimer) { timerFrames++; pump(); }
      // Re-arm a chain that is not merely late but gone (the request itself
      // was dropped). Timed off the last rAF rather than the last frame,
      // since the fallback keeps the frame clock fresh on its own, and
      // rate-limited so an occluded hour cannot pile up requests.
      if (TICKER !== "timer" && onTimer && now - lastRafAt > REVIVE_MS && now - lastReviveAt > REVIVE_MS) {
        lastReviveAt = now;
        rafArmed = false;
        rafChain();
      }
    }, FALLBACK_MS);
  }
  if (TICKER === "timer") pump();

  // Screen wake lock: the supported way to tell macOS not to idle the
  // display out from under an unattended show. It is dropped automatically
  // whenever the page is hidden, so it has to be re-taken on every return.
  let wakeLock = null;
  let wakeLockState = KEEP_AWAKE ? "pending" : "off";
  async function takeWakeLock() {
    if (!KEEP_AWAKE || wakeLock || !navigator.wakeLock || document.visibilityState !== "visible") return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLockState = "held";
      wakeLock.addEventListener("release", () => { wakeLock = null; wakeLockState = "released"; });
    } catch (e) {
      wakeLockState = "denied: " + (e && e.name ? e.name : "error");
    }
  }
  if (KEEP_AWAKE) {
    takeWakeLock();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") takeWakeLock();
    });
    // Chrome can refuse the lock before any user activation; the first
    // gesture in a kiosk session is a free retry.
    window.addEventListener("pointerdown", takeWakeLock, { once: true });
    window.addEventListener("keydown", takeWakeLock, { once: true });
  }

  // --- Controller link (BroadcastChannel 'hypermoon') --------------------
  // The controller.html hypermoon panel drives this window live and asks it
  // to report its state (that is what flips the panel from "no hypermoon
  // window connected" to showing the export query). Without this handshake
  // the controller never sees the output. Unknown keys are stored and echoed
  // back so future sliders stay coherent.
  const hmChannel = ("BroadcastChannel" in window) ? new BroadcastChannel("hypermoon") : null;
  const extraState = {};

  function buildQuery() {
    const q = new URLSearchParams();
    q.set("video", MOON_SRC);
    if (MOSAIC_WORD) q.set("word", MOSAIC_WORD);
    if (CONTENT_SRC) q.set("content", CONTENT_SRC);
    q.set("speed", SPEED.toFixed(3));
    q.set("bright", brightBase.toFixed(3));
    q.set("threshold", (+uniforms.uThresh.value).toFixed(3));
    q.set("feather", (+uniforms.uFeather.value).toFixed(3));
    q.set("lift", liftBase.toFixed(3));
    if (ALPHA !== 1) q.set("alpha", ALPHA.toFixed(2));
    if (IRIS_TARGET > 0) q.set("iris", IRIS_TARGET.toFixed(2));
    if (IRIS_R !== 0.7) q.set("irisr", IRIS_R.toFixed(2));
    if (IRIS_FEATHER !== 0.22) q.set("irisfeather", IRIS_FEATHER.toFixed(2));
    if (IRIS_ZOOM !== 2.5) q.set("iriszoom", IRIS_ZOOM.toFixed(2));
    if (MOON_SCALE !== 1) q.set("moonscale", MOON_SCALE.toFixed(2));
    if (MOON_DX !== 0) q.set("moonx", MOON_DX.toFixed(3));
    if (MOON_DY !== 0) q.set("moony", MOON_DY.toFixed(3));
    if (BLOOD_AMT > 0) {
      q.set("bloodmoon", BLOOD_AMT.toFixed(2));
      if (BLOOD_TINT !== "ff2c12") q.set("bloodtint", BLOOD_TINT);
    }
    // Mid-fade: the export query resumes the eclipse from where it is now.
    if (BLOOD_TARGET !== BLOOD_AMT && BLOOD_SEC > 0) {
      q.set("bloodtarget", BLOOD_TARGET.toFixed(2));
      q.set("bloodfade", Math.round(BLOOD_SEC));
    }
    if (ECL_ON) {
      q.set("eclipse", ECL_P.toFixed(3));
      if (ECL_PATH !== 0.35) q.set("eclipsepath", ECL_PATH.toFixed(2));
      if (ECL_DEEP !== 0.7) q.set("eclipsedeep", ECL_DEEP.toFixed(2));
      if (ECL_TARGET !== ECL_P) {
        q.set("eclipsetarget", ECL_TARGET.toFixed(2));
        q.set("eclipserun", Math.round(ECL_SEC));
      }
      if (ECL_EVERY > 0) {
        q.set("eclipseevery", String(ECL_EVERY));
        q.set("eclipserun", Math.round(ECL_SEC));
      }
    }
    if (SKY_COUNT > 0) {
      q.set("stars", String(SKY_COUNT));
      if (SKY_METEORS !== 5) q.set("meteors", SKY_METEORS.toFixed(1));
      if (SKY_DRIFT !== 1) q.set("stardrift", SKY_DRIFT.toFixed(2));
    }
    if (BACKDROP_SRC) {
      q.set("backdrop", BACKDROP_SRC);
      if (BACK_SCALE !== 1) q.set("backscale", BACK_SCALE.toFixed(2));
      if (!BACK_FIT) q.set("backfit", "0");
      if (BACK_ALPHA !== 1) q.set("backalpha", BACK_ALPHA.toFixed(2));
      if (BACK_SEC !== 12) q.set("backsec", BACK_SEC.toFixed(1));
      if (BACK_SPEED !== 1) q.set("backspeed", BACK_SPEED.toFixed(2));
    }
    if (LOGO_SRC) {
      q.set("logo", LOGO_SRC);
      if (LOGO_MODE !== "cubes") q.set("logomode", LOGO_MODE);
      if (LOGO_INK !== 0.42) q.set("logoink", LOGO_INK.toFixed(2));
      if (LOGO_SEC !== 24) q.set("logosec", LOGO_SEC.toFixed(0));
      if (LOGO_SCALE !== 1.7) q.set("logoscale", LOGO_SCALE.toFixed(2));
    }
    if (FLASH_SRC) {
      q.set("flash", FLASH_SRC);
      if (FLASH_SEC !== 60) q.set("flashsec", FLASH_SEC.toFixed(1));
      if (FLASH_HOLD !== 3) q.set("flashhold", FLASH_HOLD.toFixed(2));
      if (FLASH_SCALE !== 1) q.set("flashscale", FLASH_SCALE.toFixed(2));
      if (FLASH_GAIN !== 1) q.set("flashgain", FLASH_GAIN.toFixed(2));
    }
    if (REACT !== 1) q.set("react", REACT.toFixed(2));
    if (MIC) q.set("mic", "1");
    q.set("flicker", (+uniforms.uFlicker.value).toFixed(2));
    q.set("angw", (+uniforms.uAng.value.x).toFixed(2));
    q.set("angh", (+uniforms.uAng.value.y).toFixed(2));
    if (WIN_SCALE !== 1) q.set("winscale", WIN_SCALE.toFixed(2));
    // winsolid is deliberately not exported: like winbright it is a property
    // of the content in the window, and carrying it across a content switch
    // would paint the next clip opaque.
    q.set("lonoff", (LON_OFF * 180 / Math.PI).toFixed(0));
    q.set("latoff", (LAT_OFF * 180 / Math.PI).toFixed(0));
    if (VAJRA_COUNT > 0) {
      q.set("vajras", String(VAJRA_COUNT));
      q.set("vajraradius", VAJRA_RADIUS.toFixed(2));
      q.set("vajratilt", VAJRA_TILT.toFixed(2));
    }
    if (FISHER_LIVE) {
      q.set("fisherlive", "1");
      q.set("fisherlivesize", FISHER_LIVE_SIZE.toFixed(2));
      q.set("fisherliveangle", FISHER_LIVE_ANG.toFixed(0));
      q.set("fisherlivedist", FISHER_LIVE_DIST.toFixed(2));
    }
    if (BLEED > 0) q.set("bleed", BLEED.toFixed(1));
    if (APPARITION > 0) q.set("apparition", APPARITION.toFixed(1));
    if (PEEK > 0 && WIN) q.set("peek", PEEK.toFixed(0));
    if (CONTENT_KEY === "crt") q.set("when", WHEN);
    for (const k in extraState) {
      if (extraState[k] != null && !q.has(k)) q.set(k, String(extraState[k]));
    }
    return q.toString();
  }

  function currentState() {
    return Object.assign({
      speed: SPEED,
      bright: brightBase,
      thresh: +uniforms.uThresh.value,
      feather: +uniforms.uFeather.value,
      lift: liftBase,
      alpha: ALPHA,
      iris: IRIS_TARGET,
      irisr: IRIS_R,
      irisfeather: IRIS_FEATHER,
      iriszoom: IRIS_ZOOM,
      moonscale: MOON_SCALE,
      moonx: MOON_DX,
      moony: MOON_DY,
      bloodmoon: BLOOD_AMT,
      bloodtint: BLOOD_TINT,
      bloodtarget: BLOOD_TARGET,
      bloodfade: BLOOD_SEC,
      eclipseon: ECL_ON ? 1 : 0,
      eclipse: ECL_P,
      eclipsetarget: ECL_TARGET,
      eclipserun: ECL_SEC,
      eclipseevery: ECL_EVERY,
      eclipsepath: ECL_PATH,
      eclipsedeep: ECL_DEEP,
      stars: SKY_COUNT,
      meteors: SKY_METEORS,
      stardrift: SKY_DRIFT,
      backdrop: BACKDROP_SRC,
      logo: LOGO_SRC,
      logomode: LOGO_MODE,
      logoink: LOGO_INK,
      logosec: LOGO_SEC,
      logoscale: LOGO_SCALE,
      flash: FLASH_SRC,
      flashsec: FLASH_SEC,
      flashhold: FLASH_HOLD,
      flashscale: FLASH_SCALE,
      flashgain: FLASH_GAIN,
      backscale: BACK_SCALE,
      backfit: BACK_FIT ? 1 : 0,
      backalpha: BACK_ALPHA,
      backsec: BACK_SEC,
      backspeed: BACK_SPEED,
      react: REACT,
      mic: MIC,
      flicker: +uniforms.uFlicker.value,
      angw: +uniforms.uAng.value.x,
      angh: +uniforms.uAng.value.y,
      winscale: WIN_SCALE,
      winsolid: +uniforms.uWinSolid.value,
      winparallax: +uniforms.uWinPar.value,
      winbox: +uniforms.uWinBox.value,
      lon: LON_OFF * 180 / Math.PI,
      lat: LAT_OFF * 180 / Math.PI,
      vajras: VAJRA_COUNT,
      vajraRadius: VAJRA_RADIUS,
      vajraTilt: VAJRA_TILT,
      fisherlive: FISHER_LIVE ? 1 : 0,
      fisherlivesize: FISHER_LIVE_SIZE,
      fisherliveangle: FISHER_LIVE_ANG,
      fisherlivedist: FISHER_LIVE_DIST,
      bleed: BLEED,
      apparition: APPARITION,
      when: WHEN,
      program: progName,
      programUnknown: progUnknown,
      programRot: progApplied,
      programLen: progSchedule ? progSchedule.length : 0,
      rotSeconds: rotationPeriod() / Math.max(SPEED, 0.001),
      streaming: !!streamSession,
      streamStatus: streamStatus
    }, extraState);
  }

  function announce() {
    if (!hmChannel) return;
    hmChannel.postMessage({
      type: "moonState",
      query: buildQuery(),
      state: currentState(),
      sources: { video: MOON_SRC, word: MOSAIC_WORD, content: CONTENT_SRC }
    });
  }

  function applyLiveConfig(set) {
    if (!set || typeof set !== "object") return;
    for (const key in set) {
      const v = set[key];
      switch (key) {
        // Chrome throws on playbackRate < 0.0625; clamp so a low slider
        // value slows to minimum instead of aborting the whole config batch.
        case "speed": SPEED = Math.max(0.0625, v); moon.video.playbackRate = SPEED; break;
        case "bright": brightBase = v; uniforms.uBright.value = v; break;
        case "thresh": uniforms.uThresh.value = v; break;
        case "feather": uniforms.uFeather.value = v; break;
        case "lift": liftBase = v; uniforms.uLift.value = v; break;
        case "alpha": ALPHA = Math.max(0, Math.min(1, v)); uniforms.uAlpha.value = ALPHA; break;
        case "iris": IRIS_TARGET = Math.max(0, Math.min(1, v)); break;
        case "irisr": IRIS_R = Math.max(0.1, Math.min(1, v)); uniforms.uIrisR.value = IRIS_R; break;
        case "irisfeather": IRIS_FEATHER = Math.max(0.01, v); uniforms.uIrisFeather.value = IRIS_FEATHER; break;
        case "bloodmoon": BLOOD_AMT = Math.max(0, Math.min(1, v)); BLOOD_TARGET = BLOOD_AMT; uniforms.uBloodAmt.value = BLOOD_AMT; break;
        case "bloodfade": BLOOD_SEC = Math.max(0, v); break;
        case "bloodtarget": BLOOD_TARGET = Math.max(0, Math.min(1, v)); break;
        case "bloodstop": BLOOD_TARGET = uniforms.uBloodAmt.value; BLOOD_AMT = BLOOD_TARGET; break;
        case "eclipse":
          ECL_ON = true; uniforms.uEclOn.value = 1;
          ECL_P = Math.max(0, Math.min(1, v)); ECL_TARGET = ECL_P;
          uniforms.uEcl.value.x = ECL_P;
          break;
        case "eclipserun": ECL_SEC = Math.max(0, v); break;
        case "eclipseevery": ECL_EVERY = Math.max(0, v); eclNextAt = 0; break;
        case "eclipsetarget":
          ECL_ON = true; uniforms.uEclOn.value = 1;
          ECL_TARGET = Math.max(0, Math.min(1, v));
          break;
        case "eclipsepath":
          ECL_PATH = Math.max(0, Math.min(3, v));
          uniforms.uEcl.value.w = ECL_PATH;
          break;
        case "eclipsestop": ECL_TARGET = ECL_P; eclNextAt = 0; break;
        case "eclipsedeep":
          ECL_DEEP = Math.max(0, Math.min(1, v));
          uniforms.uEclDeep.value = ECL_DEEP;
          break;
        case "eclipseon":
          ECL_ON = !!v && v !== "0";
          uniforms.uEclOn.value = ECL_ON ? 1 : 0;
          if (!ECL_ON) { ECL_TARGET = ECL_P; }
          break;
        case "bloodtint": {
          const hex = String(v).replace(/[^0-9a-fA-F]/g, "");
          if (hex.length === 6 || hex.length === 3) { BLOOD_TINT = hex; uniforms.uBlood.value.set("#" + hex); }
          break;
        }
        case "irissec": IRIS_SEC = Math.max(0.1, v); break;
        case "backdrop": setBackdrop(v); break;
        case "backscale": BACK_SCALE = Math.max(0.05, v); break;
        case "backfit": BACK_FIT = !!v; setBackdrop(BACKDROP_SRC); break;
        case "backalpha": BACK_ALPHA = Math.max(0, Math.min(1, v)); break;
        case "backsec": BACK_SEC = Math.max(0, v); setBackdrop(BACKDROP_SRC); break;
        case "backspeed":
          BACK_SPEED = Math.max(0.1, v);
          // Gif layers read this each frame; a video has to be told.
          backdrop.players.forEach((p) => { if (p.video) p.video.playbackRate = BACK_SPEED; });
          break;
        case "stars": setStars(v); break;
        case "meteors": SKY_METEORS = Math.max(0, v); break;
        case "stardrift": SKY_DRIFT = Math.max(0, v); break;
        case "iriszoom": IRIS_ZOOM = Math.max(1, v); break;
        case "moonscale": MOON_SCALE = Math.max(0.1, Math.min(2, v)); fitQuad(); break;
        case "moonx": MOON_DX = v; break;
        case "moony": MOON_DY = v; break;
        case "react": REACT = Math.max(0, v); break;
        case "mic": setMic(!!v && v !== "0"); break;
        case "flicker": uniforms.uFlicker.value = v; break;
        case "angw": AUTO_ANG = false; angTarget.w = v; break;
        case "angh": AUTO_ANG = false; angTarget.h = v; break;
        case "winscale": WIN_SCALE = Math.max(0.3, v); break;
        case "winsolid": uniforms.uWinSolid.value = Math.max(0, Math.min(1, v)); break;
        case "winparallax": uniforms.uWinPar.value = Math.max(0, Math.min(1, v)); break;
        case "winbox": uniforms.uWinBox.value = Math.max(0, Math.min(1, v)); break;
        case "wingate": uniforms.uWinGate.value = Math.max(0, Math.min(1, v)); break;
        case "winbright": winBrightBase = Math.max(0, v); uniforms.uWinBright.value = winBrightBase; break;
        case "lon": LON_OFF = v * (Math.PI / 180); pickAnchor(); break;
        case "lat": LAT_OFF = v * (Math.PI / 180); pickAnchor(); break;
        case "vajras": setVajraCount(v); break;
        case "fisherlive": setFisherLive(!!v && v !== "0"); break;
        case "fisherlivesize": FISHER_LIVE_SIZE = Math.max(0.2, v); break;
        case "fisherliveangle": FISHER_LIVE_ANG = v; break;
        case "fisherlivedist": FISHER_LIVE_DIST = Math.max(0, v); break;
        case "vajraRadius":
        case "vajraradius": VAJRA_RADIUS = v; break;
        case "vajraTilt":
        case "vajratilt": VAJRA_TILT = Math.max(0.05, Math.min(1, v)); break;
        case "stream": setStreaming(!!v && v !== "0"); break;
        case "bleed": BLEED = Math.max(0, v); break;
        case "apparition": APPARITION = Math.max(0, v); break;
        case "peek": PEEK = Math.max(0, v); break;
        case "word":
          MOSAIC_WORD = String(v || "").trim().toLowerCase() || MOSAIC_WORD;
          if (mosaic) {
            mosaic.setWord(MOSAIC_WORD);
            chooseLines(uniforms.uAng.value.x / uniforms.uAng.value.y);
          }
          break;
        case "logo":
          LOGO_SRC = String(v == null ? "" : v).trim();
          if (mosaic) {
            mosaic.setLogos(LOGO_SRC).then(() => {
              logoNextAt = (performance.now() - start) / 1000 + LOGO_SEC;
              chooseLines(uniforms.uAng.value.x / uniforms.uAng.value.y);
            });
          }
          break;
        case "logomode":
          LOGO_MODE = String(v || "cubes").trim().toLowerCase();
          if (mosaic) mosaic.redraw();
          break;
        case "logoink":
          LOGO_INK = Math.max(0, Math.min(1, v));
          if (mosaic) mosaic.redraw();
          break;
        case "logosec": LOGO_SEC = Math.max(0, v); break;
        case "logoscale": LOGO_SCALE = Math.max(0.3, v); break;
        case "flashsec": FLASH_SEC = Math.max(0.5, v); break;
        case "flashhold": FLASH_HOLD = Math.max(0.05, v); break;
        case "flashscale": FLASH_SCALE = Math.max(0.1, v); break;
        case "flashgain": FLASH_GAIN = Math.max(0, v); break;
        case "when":
          WHEN = String(v || "").trim() || WHEN;
          if (crt) crt.setWhen();
          break;
        case "program": setProgram(v); break;
        case "content":
          // Manual content choice takes over from any running program.
          setProgram("");
          // Swap the window content in place; layouts that can't (plain
          // text, planar) reload with the new source instead.
          if (!setWindowContent(v)) applySources({ content: v });
          break;
        default: extraState[key] = v; break;
      }
    }
  }

  function applySources(sources) {
    if (!sources) return;
    const q = new URLSearchParams(location.search);
    if (sources.video) q.set("video", sources.video);
    if (sources.word != null) { q.set("word", sources.word); q.delete("text"); }
    if (sources.content != null) {
      if (sources.content) q.set("content", sources.content); else q.delete("content");
    }
    location.search = q.toString(); // reloads with the new sources
  }

  function resurvey() {
    anchorLocked = false;
    haveAnchor = false;
    lastSampleT = -Infinity;
    surfGrid.fill(0);
  }

  if (hmChannel) {
    hmChannel.onmessage = function (event) {
      const msg = event.data;
      if (!msg) return;
      if (msg.type === "moonAudio") {
        // ~20 Hz level feed from the controller's audio deck analyser.
        feedAudio(msg.bass || 0, msg.mid || 0, msg.high || 0, msg.level || 0, !!msg.beat);
        return;
      }
      if (msg.type === "moonRequestState") { announce(); return; }
      // Someone is triaging the gif library next door. Rebuilding the swarm
      // re-reads the marks, so a gif rejected in the curator leaves the moon
      // within a second or two instead of at the next act.
      if (msg.type === "gifCuration") {
        if (gifswarm) setWindowContent(CONTENT_SRC);
        return;
      }
      if (msg.type === "moonConfig") {
        if (msg.set) applyLiveConfig(msg.set);
        if (msg.sources) { applySources(msg.sources); return; }
        if (msg.resurvey) resurvey();
        announce();
      }
    };
    // Announce on open, and again a few times in case the controller was
    // still binding its listener when the first message went out.
    announce();
    [300, 1200, 3000].forEach(function (ms) { setTimeout(announce, ms); });
    moon.video.addEventListener("playing", announce);
  }
})();
</script>
</body>
</html>
